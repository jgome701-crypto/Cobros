<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cobro de préstamo</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a0a0a">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#faf8f4;--fg:#1f2a24;--mut:#6b7570;--card:#fff;--bd:#e4e0d6;--ac:#1d7a55;--bad:#b3261e}
@media (prefers-color-scheme:dark){:root{--bg:#15191a;--fg:#e8ece9;--mut:#9aa5a0;--card:#1e2426;--bd:#2d3638;--ac:#4fbf8f;--bad:#ff8a80}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
#root{max-width:560px;margin:0 auto;padding:16px}
h1{margin:0;font-size:24px}h2{font-size:16px;margin:20px 0 8px}
.sub{margin:2px 0 14px;color:var(--mut)}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cards>div,.cards>details{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 12px}
.cards span{display:block;font-size:12px;color:var(--mut)}.cards b{font-size:17px}
.cards .big{grid-column:1/-1;border-color:var(--ac)}
.plan{margin-top:8px}.plan .big{border-color:var(--bd)}
summary{cursor:pointer;list-style:none}summary::-webkit-details-marker{display:none}
summary b{font-size:20px}.more{color:var(--ac)!important;margin-top:4px}.more::after{content:" ▾"}details[open] .more::after{content:" ▴"}
.sch{margin-top:10px;border-top:1px solid var(--bd)}
.cards .sr{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--bd);font-size:14px}
.cards .sr span{display:block;font-size:14px;color:inherit}.cards .sr span+span{text-align:right}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}.th{position:relative}
.thumbs img{width:84px;height:84px;object-fit:cover;border-radius:10px;border:1px solid var(--bd);cursor:pointer;display:block}
.th button.x{position:absolute;top:2px;right:2px;background:rgba(0,0,0,.6);color:#fff;border-radius:99px}
.al{display:flex;align-items:center;gap:8px;margin-top:8px}.al>button{flex:1;text-align:left;background:var(--card);color:var(--fg);border:1px solid var(--bd)}.al .btn{white-space:nowrap}
.zoom{position:fixed;inset:0;background:rgba(0,0,0,.88);display:flex;align-items:center;justify-content:center;padding:16px;z-index:9}
.zoom img{max-width:100%;max-height:100%;border-radius:8px}.cards .big b{font-size:28px;color:var(--ac)}
.prog{height:8px;border-radius:99px;background:var(--bd);overflow:hidden;margin:10px 0 0}
.prog i{display:block;height:100%;background:var(--ac)}
.note{margin:12px 0;padding:10px 12px;border-radius:12px;background:var(--card);border:1px solid var(--bd)}
.late{color:var(--bad);font-weight:600}.ok{color:var(--ac);font-weight:600}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
button,.btn{font:inherit;padding:9px 14px;border-radius:10px;border:0;background:var(--ac);color:#fff;cursor:pointer;text-decoration:none;display:inline-block}
button.ghost,.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--bd)}
button.x{padding:2px 8px;background:transparent;color:var(--mut)}
button:disabled{opacity:.6}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.form{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin:12px 0;display:grid;gap:8px}
label{display:grid;gap:3px;font-size:13px;color:var(--mut)}
input{font:inherit;padding:9px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);color:var(--fg);min-width:0;width:100%}
.err{color:var(--bad);font-size:14px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--bd)}
.row small,.empty{color:var(--mut)}
.item{width:100%;text-align:left;background:var(--card);color:var(--fg);border:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.item small{display:block}
</style></head>
<body><div id="root"><p class="empty">Cargando…</p></div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,createUserWithEmailAndPassword,signOut} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,collection,doc,onSnapshot,setDoc,deleteDoc,query,where,getDoc,writeBatch} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const app=initializeApp({
  apiKey:"AIzaSyDP2T1g5CDbgGoqnt-QAQI7eL2mjjsDl98",
  authDomain:"cobros-5a9e5.firebaseapp.com",
  projectId:"cobros-5a9e5",
  storageBucket:"cobros-5a9e5.firebasestorage.app",
  messagingSenderId:"838028186853",
  appId:"1:838028186853:web:97ede76ee44e2d155eb00c"
});
const auth=getAuth(app),db=getFirestore(app);
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});

const $=document.getElementById("root"),q=new URLSearchParams(location.search);
const M=n=>new Intl.NumberFormat("es-CO",{style:"currency",currency:"COP",maximumFractionDigits:0}).format(n||0);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const F=d=>d?new Date(d+"T00:00").toLocaleDateString("es-CO",{day:"numeric",month:"short",year:"numeric"}):"";
const pad=n=>String(n).padStart(2,"0");
const iso=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); // fecha local, no UTC
const today=()=>iso(new Date());
const ADMIN="pbcPzLpAIyc2vUcsllsANp0PCSW2";
const norm=d=>{const l=Object.assign({name:"",cedula:"",tel:"",fotos:[],principal:0,rate:0,start:"",pagos:[],gastos:[]},d);
  if(!l.cuotas){l.cuotas=+l.weeks||0;l.dias=l.weeks?7:30} // préstamos viejos en semanas siguen funcionando
  l.dias=+l.dias||30;return l};
const shrink=async f=>{
  let bm=null,src;
  // las fotos de cámara son enormes: se reducen al decodificar para no quedarse sin memoria
  for(const o of [{resizeWidth:1000,resizeQuality:"medium"},{}]){try{bm=await createImageBitmap(f,o);break}catch(x){}}
  if(bm)src=bm;else src=await new Promise((ok,no)=>{const im=new Image(),u=URL.createObjectURL(f);im.onload=()=>{URL.revokeObjectURL(u);ok(im)};im.onerror=()=>{URL.revokeObjectURL(u);no(new Error("img"))};im.src=u});
  const w=bm?bm.width:src.naturalWidth,h=bm?bm.height:src.naturalHeight,k=Math.min(1,800/Math.max(w,h)),cv=document.createElement("canvas");
  cv.width=Math.max(1,Math.round(w*k));cv.height=Math.max(1,Math.round(h*k));
  cv.getContext("2d").drawImage(src,0,0,cv.width,cv.height);
  if(bm&&bm.close)bm.close();
  const out=cv.toDataURL("image/jpeg",.65);
  if(!out.startsWith("data:image/jpeg")||out.length<500)throw new Error("canvas");
  return out};
const newId=()=>Array.from(crypto.getRandomValues(new Uint8Array(10)),b=>b.toString(16).padStart(2,"0")).join("");
const msg=t=>'<p class="empty">'+t+'</p>';
let owner=false,L={},cur=null,form=null,err="",askDel=false,unsub=null,fotosTmp=[],zoom=-1,showSch=false,showSim=false,showWk=false,mesOff=0,renewBal=0,deferredInstall=null,invLink="",rcode=q.get("r"),simv={cap:"",monto:"",n:"",rate:"",cuotas:"1",dias:"30"};

function calc(l){
  const p=+l.principal||0,int=p*(+l.rate||0)/100,w=+l.cuotas||1,per=+l.dias||30,cuota=(p+int)/w;
  const g=l.gastos.reduce((s,x)=>s+x.amt,0),paid=l.pagos.reduce((s,x)=>s+x.amt,0);
  const days=l.start?Math.floor((Date.now()-new Date(l.start+"T00:00"))/864e5):0;
  const el=Math.max(0,Math.min(w,Math.floor(days/per)));
  const late=Math.max(0,el*cuota+g-paid),bal=p+int+g-paid;
  let next=null;if(l.start&&el<w){const d=new Date(l.start+"T00:00");d.setDate(d.getDate()+per*(el+1));next=iso(d)}
  return{int,g,paid,cuota,late,bal,next,pct:Math.min(100,Math.round(paid/((p+int+g)||1)*100))};
}
const inp=(id,l,t,v,x)=>'<label>'+l+'<input id="'+id+'" type="'+t+'" value="'+esc(v)+'" '+(x||"")+'></label>';
function sched(l,c){const out=[];for(let k=1;k<=(+l.cuotas||0);k++){const d=new Date(l.start+"T00:00");d.setDate(d.getDate()+(+l.dias||30)*k);const di=iso(d),cov=c.paid>=k*c.cuota-.5;out.push({k,d:di,cov,late:!cov&&di<today()})}return out}
function prevHtml(){return fotosTmp.map((f,i)=>'<div class="th"><img src="'+f+'" alt="Foto '+(i+1)+'"><button class="x" data-act="rm-foto" data-i="'+i+'" aria-label="Quitar foto">✕</button></div>').join("")}
function prev(){const p=document.getElementById("f_prev");if(p)p.innerHTML=prevHtml()}
function formHtml(){
  const l=cur.loan;let h='<div class="form">';
  if(form==="setup")h+=(renewBal>0?'<div class="note">Ojo: esta persona aún debe '+M(renewBal)+' del préstamo anterior. El préstamo nuevo se maneja por separado.</div>':"")+inp("f_n","Nombre de la persona","text",l.name)+inp("f_c","Cédula","text",l.cedula||"",'inputmode="numeric"')+inp("f_tel","Celular / WhatsApp (opcional)","tel",l.tel||"",'inputmode="tel"')+inp("f_p","Monto prestado (COP)","number",l.principal||"",'inputmode="numeric"')+inp("f_r","Interés total (% sobre lo prestado)","number",l.rate||"",'step="any"')+inp("f_w","Número de cuotas","number",l.cuotas||"")+inp("f_k","Días entre cuotas (30 = cada mes)","number",l.dias||30)+'<div id="f_sim">'+newSimHtml(+l.principal||0,+l.rate||0,+l.cuotas||0,+l.dias||30,l.start||today())+"</div>"+inp("f_d","Fecha del préstamo","date",l.start||today())+'<label>Fotos de la persona (máx. 4)<input id="f_f" type="file" accept="image/*" multiple></label><div id="f_prev" class="thumbs">'+prevHtml()+'</div><small id="f_msg" class="late"></small>';
  if(form==="pago")h+=inp("f_d","Fecha del pago","date",today())+inp("f_a","Monto pagado (COP)","number","",'inputmode="numeric"')+inp("f_t","Nota (opcional)","text","");
  if(form==="gasto")h+=inp("f_d","Fecha","date",today())+inp("f_t","Descripción del gasto","text","")+inp("f_a","Monto (COP)","number","",'inputmode="numeric"');
  if(err)h+='<div class="err">'+esc(err)+"</div>";
  return h+'<div class="bar"><button data-act="save-'+form+'">Guardar</button><button class="ghost" data-act="cancel">Cancelar</button></div></div>';
}
function list(t,arr,k,fn){
  let h="<h2>"+t+"</h2>";if(!arr.length)return h+'<div class="empty">Sin registros</div>';
  arr.forEach((x,i)=>{h+='<div class="row"><div>'+fn(x)+"</div>"+(owner?'<button class="x" data-act="del-'+k+'" data-i="'+i+'" aria-label="Eliminar">✕</button>':"")+"</div>"});return h;
}
function newSimHtml(p,r,q,d,start){
  if(!(p>0))return '<div class="empty">Escribe el monto para ver cuánto ganarías con este préstamo.</div>';
  const gan=p*r/100,n=q>0?q:0,cuota=n?(p+gan)/n:0,meses=n*d/30,gm=meses>0?gan/meses:0;
  let fin="";if(start&&n&&d>0){const x=new Date(start+"T00:00");x.setDate(x.getDate()+d*n);fin=iso(x)}
  return '<h2>Ganancia de este préstamo</h2><section class="cards"><div><span>Cuota</span><b>'+M(cuota)+'</b></div><div><span>Recibes en total</span><b>'+M(p+gan)+'</b></div><div><span>Ganancia total</span><b>'+M(gan)+'</b></div><div><span>Ganancia por mes</span><b>'+M(gm)+'</b></div></section>'
   +(fin?'<p class="sub">Última cuota: '+F(fin)+" · plazo de "+meses.toFixed(1)+" meses</p>":"");
}
function waLink(l,txt){let t=String(l.tel||"").replace(/\D/g,"");if(t.length===10)t="57"+t;return"https://wa.me/"+t+"?text="+encodeURIComponent(txt)}
function clientLink(id){return location.origin+location.pathname+"?c="+id}
function dueInfo(l,c){
  const S=sched(l,c),lates=S.filter(x=>x.late),td=S.find(x=>x.d===today()&&!x.cov);
  const la=lates.length?Math.max(0,lates.length*c.cuota+c.g-c.paid):0,ho=td?Math.max(0,Math.min(c.cuota,td.k*c.cuota-c.paid)):0;
  return{late:la>0?{amt:la,dias:Math.floor((Date.now()-new Date(lates[0].d+"T00:00"))/864e5)}:null,hoy:!la&&ho>0?{amt:ho}:null};
}
function alertHtml(ids){
  const hoy=[],atr=[];
  ids.forEach(id=>{const l=L[id],c=calc(l);if(c.bal<=0)return;const d=dueInfo(l,c);if(d.late)atr.push({id,l,x:d.late});else if(d.hoy)hoy.push({id,l,x:d.hoy})});
  const row=(i,sub,txt)=>'<div class="al"><button data-act="open" data-id="'+i.id+'">'+esc(i.l.name)+sub+'<br><b>'+M(i.x.amt)+'</b></button><a class="btn" target="_blank" rel="noopener" href="'+waLink(i.l,txt)+'">Recordar</a></div>';
  let h="";
  if(atr.length)h+='<h2>Atrasados ('+atr.length+')</h2>'+atr.map(i=>row(i,'<small class="late">'+i.x.dias+(i.x.dias==1?" día":" días")+" de atraso</small>","Hola "+i.l.name+", tienes un pago atrasado de "+M(i.x.amt)+". Aquí puedes ver tu préstamo: "+clientLink(i.id))).join("");
  if(hoy.length)h+='<h2>Hoy te toca cobrar ('+hoy.length+')</h2>'+hoy.map(i=>row(i,"","Hola "+i.l.name+", te recuerdo que hoy te toca pagar tu cuota de "+M(i.x.amt)+". Aquí puedes ver tu préstamo: "+clientLink(i.id))).join("");
  return h||'<div class="note ok">Hoy no tienes cobros ni atrasos ✔</div>';
}
function mesDetalle(off){
  const t=new Date();t.setDate(1);t.setMonth(t.getMonth()+off);
  const Y=t.getFullYear(),Mo=t.getMonth(),ym=Y+"-"+pad(Mo+1),dim=new Date(Y,Mo+1,0).getDate(),fo=(new Date(Y,Mo,1).getDay()+6)%7;
  const W={},wk=day=>Math.floor((day-1+fo)/7),get=w=>W[w]||(W[w]={items:[],esp:0,cob:0});
  let cob=0,ganCob=0,esp=0,ganEsp=0;
  for(const id of Object.keys(L)){
    const l=L[id],c=calc(l),tot=(+l.principal||0)+c.int,r=tot>0?c.int/tot:0;
    for(const x of l.pagos)if((x.d||"").startsWith(ym)){const w=get(wk(+x.d.slice(8,10)));w.cob+=x.amt;cob+=x.amt;ganCob+=x.amt*r}
    for(let k=1;k<=(+l.cuotas||0);k++){
      const d=new Date(l.start+"T00:00");d.setDate(d.getDate()+(+l.dias||30)*k);
      if(iso(d).startsWith(ym)){
        const cov=c.paid>=k*c.cuota-.5,w=get(wk(d.getDate()));
        w.items.push({name:l.name,amt:c.cuota,day:d.getDate(),cov,late:!cov&&iso(d)<today()});
        w.esp+=c.cuota;esp+=c.cuota;ganEsp+=c.cuota*r;
      }
    }
  }
  const largo=t.toLocaleDateString("es-CO",{month:"long"}),corto=largo.slice(0,3);
  const weeks=Object.keys(W).map(Number).sort((a,b)=>a-b).map(w=>{
    const a=Math.max(1,1+w*7-fo),b=Math.min(dim,(w+1)*7-fo),x=W[w];
    x.items.sort((p,q)=>p.day-q.day);
    return Object.assign({label:"Semana "+(w+1)+" · "+a+(b>a?"–"+b:"")+" "+corto},x);
  });
  return{nombre:largo+" "+Y,weeks,cob,ganCob,esp,ganEsp};
}
function mesHtml(){
  const m=mesDetalle(mesOff);
  const nav='<div class="bar" style="justify-content:space-between;align-items:center"><button class="ghost" data-act="mes" data-d="-1" aria-label="Mes anterior">◀</button><b style="text-transform:capitalize">'+esc(m.nombre)+'</b><button class="ghost" data-act="mes" data-d="1" aria-label="Mes siguiente">▶</button></div>';
  const st=i=>i.cov?'<span class="ok">Pagada</span>':i.late?'<span class="late">Atrasada</span>':"Pendiente";
  return '<section class="cards plan"><details class="big" id="wk"'+(showWk?" open":"")+'><summary><b style="font-size:16px">Pagos por semana</b><span class="more">Cuotas y cobros de '+esc(m.nombre)+'</span></summary><div class="sch">'+nav
   +'<p class="sub">Por cobrar del mes: '+M(m.esp)+' (ganancia '+M(m.ganEsp)+') · Cobrado: '+M(m.cob)+' (ganancia '+M(m.ganCob)+')</p>'
   +(m.weeks.length?m.weeks.map(w=>'<h2>'+w.label+'</h2><p class="sub">Por cobrar '+M(w.esp)+' · Cobrado '+M(w.cob)+'</p>'+w.items.map(i=>'<div class="sr"><span>'+i.day+" · "+esc(i.name)+"</span><span>"+M(i.amt)+" · "+st(i)+"</span></div>").join("")).join(""):'<div class="empty">No hay cuotas ni pagos en este mes.</div>')
   +"</div></details></section>";
}
function simCalc(v){
  const m=+v.monto||0,r=+v.rate||0,q=+v.cuotas||0,d=+v.dias||0,cap=+v.cap||0;
  let n=Math.floor(+v.n)||0;if(!n)n=m>0?(cap>0?Math.floor(cap/m):1):0;
  const gan=m*r/100,cuota=q>0?(m+gan)/q:0,meses=q*d/30,gm=meses>0?gan/meses:0;
  return{n,m,gan,cuota,meses,gm,tot:n*m,ganT:n*gan,ganM:n*gm,recibir:n*(m+gan),over:cap>0?Math.max(0,n*m-cap):0};
}
function simHtml(){
  const s=simCalc(simv);
  if(!(s.m>0))return '<div class="empty">Escribe el monto por persona para ver el cálculo.</div>';
  return '<h2>Por persona</h2><section class="cards"><div><span>Cuota (cada '+(+simv.dias||0)+' días)</span><b>'+M(s.cuota)+'</b></div><div><span>Ganancia total</span><b>'+M(s.gan)+'</b></div><div class="big"><span>Ganancia por mes</span><b>'+M(s.gm)+'</b></div></section><p class="sub">Plazo: '+s.meses.toFixed(1)+' meses</p>'
   +'<h2>En total · '+s.n+(s.n==1?" persona":" personas")+'</h2><section class="cards"><div><span>Prestas</span><b>'+M(s.tot)+'</b></div><div><span>Recibes</span><b>'+M(s.recibir)+'</b></div><div><span>Ganancia total</span><b>'+M(s.ganT)+'</b></div><div><span>Ganancia por mes</span><b>'+M(s.ganM)+'</b></div></section>'
   +(s.over>0?'<div class="err">Te pasas de tu capital por '+M(s.over)+".</div>":"");
}
function simBox(){
  return '<section class="cards plan"><details class="big" id="sim"'+(showSim?" open":"")+'><summary><b style="font-size:16px">Simulador de varias personas</b><span class="more">Ej.: 10 personas de $80.000 a 4 cuotas</span></summary><div class="sch">'
   +inp("s_cap","Capital disponible (opcional)","number",simv.cap,'inputmode="decimal" step="any"')
   +inp("s_monto","Monto por persona","number",simv.monto,'inputmode="decimal" step="any"')
   +inp("s_n","Número de personas (vacío = las que alcance el capital)","number",simv.n,'inputmode="numeric"')
   +inp("s_rate","Interés total del préstamo (%)","number",simv.rate,'inputmode="decimal" step="any"')
   +inp("s_cuotas","Número de cuotas","number",simv.cuotas,'inputmode="numeric"')
   +inp("s_dias","Días entre cuotas","number",simv.dias,'inputmode="numeric"')
   +'<div id="sim_out">'+simHtml()+"</div></div></details></section>";
}
function view(){
  if(owner&&!cur){
    const ids=Object.keys(L).sort((a,b)=>L[a].name.localeCompare(L[b].name));
    const tot=ids.reduce((s,id)=>s+Math.max(0,calc(L[id]).bal),0);
    let h='<div class="bar" style="justify-content:space-between;margin-top:0"><h1>Mis préstamos</h1><button class="ghost" data-act="logout">Salir</button></div>';
    h+='<p class="sub">'+(ids.length?"Por cobrar en total: <b>"+M(tot)+"</b>. Toca uno para verlo o editarlo.":"")+"</p>";
    if(!ids.length)h+=msg("Aún no tienes préstamos.");
    else{
      const prest=ids.reduce((x,id)=>x+(+L[id].principal||0),0);
      const act=ids.filter(id=>calc(L[id]).bal>0);
      const gi=ids.reduce((x,id)=>x+calc(L[id]).int,0);
      h+='<section class="cards"><div><span>Total prestado</span><b>'+M(prest)+'</b><span>'+ids.length+(ids.length==1?" persona":" personas")+'</span></div><div><span>Ganancia (intereses)</span><b>'+M(gi)+'</b><span>suma de '+ids.length+(ids.length==1?" préstamo":" préstamos")+'</span></div></section>';
    }
    if(ids.length)h+=alertHtml(ids)+mesHtml();
    h+=simBox();
    ids.forEach(id=>{const l=L[id],c=calc(l);h+='<button class="item" data-act="open" data-id="'+id+'"><span>'+esc(l.name)+(c.bal>0&&c.late>0?'<small class="late">Atrasado: '+M(c.late)+"</small>":c.bal<=0?'<small class="ok">Pagado</small>':"")+"</span><b>"+M(c.bal)+"</b></button>"});
    return $.innerHTML=h+'<div class="bar"><button data-act="new">+ Nuevo préstamo</button></div>'+invBox()+(err?'<div class="err">'+esc(err)+"</div>":"");
  }
  const l=cur.loan,c=calc(l);let h="";
  if(owner)h+='<div class="bar"><button class="ghost" data-act="back">← Todos</button></div>';
  h+="<h1>"+esc(l.name||"Nuevo préstamo")+"</h1>";
  if(l.name){
    h+='<p class="sub">Préstamo del '+F(l.start)+(l.cedula?" · Cédula "+(owner?esc(l.cedula):"••••"+esc(String(l.cedula).slice(-3))):"")+"</p>";
    if(!owner&&c.bal>0){const d=dueInfo(l,c);if(d.late)h+='<div class="note late">⚠ Tienes un pago atrasado de '+M(d.late.amt)+" ("+d.late.dias+(d.late.dias==1?" día":" días")+").</div>";else if(d.hoy)h+='<div class="note">📅 Hoy te toca pagar tu cuota de <b>'+M(d.hoy.amt)+"</b>.</div>"}
    if(!owner&&deferredInstall)h+='<div class="bar"><button data-act="install">Instalar en mi celular</button></div>';
    h+='<section class="cards"><div class="big"><span>Saldo pendiente</span><b>'+M(c.bal)+'</b><div class="prog"><i style="width:'+c.pct+'%"></i></div></div><div><span>Prestado</span><b>'+M(l.principal)+"</b></div><div><span>Interés ("+esc(l.rate)+"%)</span><b>"+M(c.int)+"</b></div><div><span>Gastos</span><b>"+M(c.g)+"</b></div><div><span>Pagado ("+c.pct+"%)</span><b>"+M(c.paid)+"</b></div></section>";
    const cd=c.bal<=0?'<span class="ok">Pagado completo ✔</span>':c.late>0?'<span class="late">Atrasado: '+M(c.late)+"</span>":'<span class="ok">Al día</span>';
    const S=sched(l,c);
    h+='<section class="cards plan"><div><span>Cuota</span><b>'+M(c.cuota)+'</b></div><div><span>Plazo</span><b>'+esc(l.cuotas)+(l.cuotas==1?" cuota":" cuotas")+'</b><span>cada '+esc(l.dias)+' días</span></div>'
      +'<details class="big" id="sch"'+(showSch?" open":"")+'><summary><span>Próximo cobro · '+cd+'</span><b>'+(c.next&&c.bal>0?F(c.next):"—")+'</b><span class="more">Ver todas las fechas</span></summary><div class="sch">'
      +S.map(x=>'<div class="sr"><span>Cuota '+x.k+" · "+F(x.d)+"</span><span>"+M(c.cuota)+" · "+(x.cov?'<span class="ok">Pagada</span>':x.late?'<span class="late">Atrasada</span>':"Pendiente")+"</span></div>").join("")+"</div></details></section>";
  }
  if(owner){
    h+=form?formHtml():'<div class="bar"><button data-act="pago">+ Pago</button><button data-act="gasto">+ Gasto</button><button class="ghost" data-act="setup">Editar préstamo</button>'+(l.name?'<button class="ghost" data-act="renew">Renovar / prestar más</button>':"")+"</div>";
    if(l.name){
      const link=location.origin+location.pathname+"?c="+cur.id;
      h+='<label>Link para tu cliente<input readonly value="'+link+'" onclick="this.select()"></label>';
      h+='<div class="bar"><button class="ghost" data-act="copy">Copiar link</button><a class="btn ghost" target="_blank" rel="noopener" href="https://wa.me/?text='+encodeURIComponent("Aquí puedes ver el estado de tu préstamo: "+link)+'">Enviar por WhatsApp</a></div>';
    }
    if(err&&!form)h+='<div class="err">'+esc(err)+"</div>";
  }
  if(l.name&&l.fotos.length)h+='<h2>Fotos</h2><div class="thumbs">'+l.fotos.map((f,i)=>'<img src="'+f+'" data-act="zoom" data-i="'+i+'" alt="Foto '+(i+1)+'">').join("")+"</div>";
  if(l.name){
    h+=list("Pagos",l.pagos,"pago",x=>"<b>"+M(x.amt)+"</b><br><small>"+F(x.d)+(x.n?" · "+esc(x.n):"")+"</small>");
    h+=list("Gastos",l.gastos,"gasto",x=>"<b>"+M(x.amt)+"</b> · "+esc(x.desc)+"<br><small>"+F(x.d)+"</small>");
  }
  if(owner&&l.name)h+='<div class="bar"><button class="ghost" data-act="'+(askDel?"del-loan":"ask-del")+'">'+(askDel?"Toca otra vez para eliminar":"Eliminar préstamo")+"</button></div>";
  if(zoom>=0&&l.fotos[zoom])h+='<div class="zoom" data-act="unzoom"><img src="'+l.fotos[zoom]+'" alt="Foto"></div>';
  $.innerHTML=h;
}
function askLogin(m){$.innerHTML='<h1>Entrar</h1><div class="form">'+inp("f_e","Correo","email","",'autocomplete="username"')+inp("f_pw","Contraseña","password","",'autocomplete="current-password"')+(m?'<div class="err">'+m+"</div>":"")+'<button data-act="login">Entrar</button></div>'}

function askRegister(m){$.innerHTML='<h1>Crear cuenta</h1><p class="sub">Te invitaron a usar la app de cobros. Crea tu usuario para empezar.</p><div class="form">'+inp("f_e","Correo","email","",'autocomplete="username"')+inp("f_pw","Contraseña (mínimo 6 caracteres)","password","",'autocomplete="new-password"')+inp("f_pw2","Repite la contraseña","password","",'autocomplete="new-password"')+(m?'<div class="err">'+esc(m)+"</div>":"")+'<button data-act="register">Crear mi cuenta</button></div>'}
async function registerFlow(){
  try{const s=await getDoc(doc(db,"invitaciones",rcode));
    if(!s.exists()||s.data().usado){$.innerHTML=msg("Esta invitación no es válida o ya fue usada. Pídele a quien te la envió una nueva.");return}
  }catch(x){$.innerHTML=msg("No se pudo verificar la invitación. Intenta de nuevo.");return}
  askRegister();
}
function invBox(){
  if(!(auth.currentUser&&auth.currentUser.uid===ADMIN))return"";
  let h='<h2>Prestamistas</h2><p class="sub">Invita a alguien para que use la app con su propio usuario.</p><div class="bar"><button class="ghost" data-act="invite">Crear link de invitación</button></div>';
  if(invLink)h+='<label>Link de invitación (sirve una sola vez)<input readonly value="'+esc(invLink)+'" onclick="this.select()"></label><div class="bar"><button class="ghost" data-act="copy-inv">Copiar link</button><a class="btn ghost" target="_blank" rel="noopener" href="https://wa.me/?text='+encodeURIComponent("Te invito a usar la app de cobros. Crea tu cuenta aquí: "+invLink)+'">Enviar por WhatsApp</a></div>';
  return h;
}
async function save(loan){
  err="";
  try{await setDoc(doc(db,"prestamos",cur.id),loan);cur.loan=loan;delete cur.draft;L[cur.id]=loan;form=null;renewBal=0}
  catch(e){err="No se pudo guardar ("+(e.code||"error")+"). Revisa tu conexión e intenta de nuevo."}
  view();
}
$.addEventListener("click",async e=>{
  const b=e.target.closest("[data-act]");if(!b)return;const a=b.dataset.act,v=id=>document.getElementById(id).value;
  if(a==="login"){b.disabled=true;try{await signInWithEmailAndPassword(auth,v("f_e").trim(),v("f_pw"))}catch(x){askLogin("Correo o contraseña incorrectos.")}return}
  if(a==="register"){
    const em=v("f_e").trim(),p1=v("f_pw"),p2=v("f_pw2");
    if(!em||p1.length<6)return askRegister("Escribe tu correo y una contraseña de al menos 6 caracteres.");
    if(p1!==p2)return askRegister("Las contraseñas no coinciden.");
    b.disabled=true;
    try{
      let user;
      try{user=(await createUserWithEmailAndPassword(auth,em,p1)).user}
      catch(x){if(x.code==="auth/email-already-in-use")user=(await signInWithEmailAndPassword(auth,em,p1)).user;else throw x}
      const ya=await getDoc(doc(db,"prestamistas",user.uid)).catch(()=>null);
      if(!(ya&&ya.exists())){const bt=writeBatch(db);bt.set(doc(db,"prestamistas",user.uid),{codigo:rcode,correo:em,creado:Date.now()});bt.update(doc(db,"invitaciones",rcode),{usado:true,uid:user.uid});await bt.commit()}
      history.replaceState(null,"",location.pathname);rcode=null;startOwner();
    }catch(x){
      const c=x.code||"";
      askRegister(c==="auth/invalid-email"?"El correo no es válido.":c==="auth/weak-password"?"La contraseña es muy débil.":c.startsWith("auth/")?"Ese correo ya tiene cuenta. Revisa la contraseña.":"No se pudo activar tu cuenta ("+(c||"error")+"). Pide un link nuevo.");
    }
    return;
  }
  if(a==="install"&&deferredInstall){deferredInstall.prompt();deferredInstall=null;return view()}
  if(a==="zoom"){zoom=+b.dataset.i;return view()}
  if(a==="unzoom"){zoom=-1;return view()}
  if(!owner)return;err="";
  if(a==="logout")return signOut(auth);
  if(a==="invite"){const code=newId();try{await setDoc(doc(db,"invitaciones",code),{creado:Date.now(),usado:false});invLink=location.origin+location.pathname+"?r="+code}catch(x){err="No se pudo crear la invitación ("+(x.code||"error")+"). ¿Ya actualizaste las reglas de Firestore?"}return view()}
  if(a==="copy-inv"){try{await navigator.clipboard.writeText(invLink);b.textContent="¡Copiado!"}catch(x){b.textContent="Selecciona y copia el link"}return}
  if(a==="mes"){mesOff+=+b.dataset.d;return view()}
  if(a==="rm-foto"){fotosTmp.splice(+b.dataset.i,1);return prev()}
  if(a==="open"){cur={id:b.dataset.id,loan:L[b.dataset.id]};renewBal=0;form=null;askDel=false;zoom=-1;return view()}
  if(a==="back"){cur=null;form=null;renewBal=0;return view()}
  if(a==="new"){cur={id:newId(),loan:norm(),draft:true};renewBal=0;form="setup";fotosTmp=[];return view()}
  if(a==="renew"){const o=cur.loan,bal=calc(o).bal;renewBal=bal>0?bal:0;cur={id:newId(),loan:norm({name:o.name,cedula:o.cedula,tel:o.tel,fotos:[...(o.fotos||[])]}),draft:true};fotosTmp=[...(o.fotos||[])];form="setup";return view()}
  if(a==="cancel"){form=null;renewBal=0;if(cur.draft)cur=null;return view()}
  if(a==="copy"){try{await navigator.clipboard.writeText(location.origin+location.pathname+"?c="+cur.id);b.textContent="¡Copiado!"}catch(x){b.textContent="Selecciona y copia el link"}return}
  if(["pago","gasto","setup"].includes(a)){form=a;if(a==="setup")fotosTmp=[...(cur.loan.fotos||[])];return view()}
  if(a==="ask-del"){askDel=true;return view()}
  if(a==="del-loan"){try{await deleteDoc(doc(db,"prestamos",cur.id));delete L[cur.id];cur=null}catch(x){err="No se pudo eliminar ("+(x.code||"error")+")."}askDel=false;return view()}
  const l=structuredClone(cur.loan);
  if(a==="save-setup"){
    const n=v("f_n").trim(),p=+v("f_p"),r=+v("f_r"),w=+v("f_w"),k=+v("f_k"),d=v("f_d");
    if(!n||!(p>0)||!(w>0)||!(k>0)||!d||r<0){err="Completa nombre, monto, cuotas, días y fecha.";return view()}
    Object.assign(l,{name:n,cedula:v("f_c").trim(),tel:v("f_tel").trim(),principal:p,rate:r,cuotas:w,dias:k,start:d,fotos:fotosTmp.slice()});
    if(!l.uid)l.uid=auth.currentUser.uid;
    if(JSON.stringify(l).length>900000){err="Las fotos pesan demasiado. Quita alguna.";return view()}
  }else if(a==="save-pago"||a==="save-gasto"){
    const amt=+v("f_a");if(!(amt>0)){err="Escribe un monto válido.";return view()}
    if(a==="save-pago")l.pagos.push({d:v("f_d"),amt,n:v("f_t").trim()});
    else{if(!v("f_t").trim()){err="Escribe una descripción.";return view()}l.gastos.push({d:v("f_d"),amt,desc:v("f_t").trim()})}
    l.pagos.sort((x,y)=>x.d<y.d?-1:1);l.gastos.sort((x,y)=>x.d<y.d?-1:1);
  }else if(a==="del-pago"||a==="del-gasto"){
    if(!confirm("¿Eliminar este registro?"))return;
    l[a==="del-pago"?"pagos":"gastos"].splice(+b.dataset.i,1);
  }else return;
  b.disabled=true;await save(l);
});
$.addEventListener("change",async e=>{
  if(e.target.id!=="f_f")return;
  const fs=Array.from(e.target.files);e.target.value="";let bad=0,full=false;
  for(const f of fs){if(fotosTmp.length>=4){full=true;break}try{fotosTmp.push(await shrink(f))}catch(x){bad++}}
  prev();const m=document.getElementById("f_msg");
  if(m)m.textContent=full?"Máximo 4 fotos. Quita una (✕) para agregar otra.":bad?"No se pudo leer "+bad+" foto(s). Si la tomaste con la cámara, elígela desde la galería o toma la foto en formato JPG.":"";
});
$.addEventListener("input",e=>{
  if(["f_p","f_r","f_w","f_k","f_d"].includes(e.target.id)){
    const o=document.getElementById("f_sim"),g=id=>+(document.getElementById(id)||{}).value||0;
    if(o)o.innerHTML=newSimHtml(g("f_p"),g("f_r"),g("f_w"),g("f_k")||30,(document.getElementById("f_d")||{}).value||today());
    return;
  }
  const k={s_cap:"cap",s_monto:"monto",s_n:"n",s_rate:"rate",s_cuotas:"cuotas",s_dias:"dias"}[e.target.id];
  if(!k)return;simv[k]=e.target.value;const o=document.getElementById("sim_out");if(o)o.innerHTML=simHtml();
});
$.addEventListener("toggle",e=>{if(e.target.id==="sch")showSch=e.target.open;if(e.target.id==="sim")showSim=e.target.open;if(e.target.id==="wk")showWk=e.target.open},true);
$.addEventListener("keydown",e=>{if(e.key==="Enter"&&(e.target.id==="f_pw"||e.target.id==="f_pw2")){const bt=document.querySelector('[data-act="login"]')||document.querySelector('[data-act="register"]');if(bt)bt.click()}});

// ---- Arranque ----
const c=q.get("c");
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferredInstall=e;if(!owner&&cur)view()});
if(c){ // vista del cliente: solo lectura, sin sesión
  try{ // manifiesto propio: la app instalada se abre directo en el préstamo de este cliente
    const base=location.origin+location.pathname.replace(/[^/]*$/,""),start=base+"?c="+encodeURIComponent(c);
    const mf={name:"Mi préstamo",short_name:"Mi préstamo",id:start,start_url:start,scope:base,display:"standalone",background_color:"#0a0a0a",theme_color:"#0a0a0a",
      icons:[{src:base+"icon-192.png",sizes:"192x192",type:"image/png",purpose:"any"},{src:base+"icon-512.png",sizes:"512x512",type:"image/png",purpose:"any"},{src:base+"maskable-512.png",sizes:"512x512",type:"image/png",purpose:"maskable"}]};
    const lk=document.querySelector('link[rel="manifest"]');if(lk)lk.href=URL.createObjectURL(new Blob([JSON.stringify(mf)],{type:"application/manifest+json"}));
  }catch(x){}
  onSnapshot(doc(db,"prestamos",c),
    s=>{if(s.exists()){cur={id:c,loan:norm(s.data())};view()}else $.innerHTML=msg("No encontramos este préstamo. Revisa el enlace.")},
    ()=>$.innerHTML=msg("No se pudo cargar. Intenta de nuevo."));
}else if(rcode){registerFlow()}else startOwner();
function startOwner(){
  onAuthStateChanged(auth,u=>{
    if(unsub){unsub();unsub=null}
    if(!u){owner=false;L={};cur=null;form=null;return askLogin()}
    owner=true;
    unsub=onSnapshot(u.uid===ADMIN?collection(db,"prestamos"):query(collection(db,"prestamos"),where("uid","==",u.uid)),
      s=>{
        L={};s.forEach(d=>L[d.id]=norm(d.data()));
        if(cur&&!cur.draft){if(L[cur.id])cur.loan=L[cur.id];else cur=null}
        if(!form)view();
      },
      e=>$.innerHTML=msg("No se pudo leer los datos ("+esc(e.code)+"). Revisa las reglas de Firestore."));
  });
}
