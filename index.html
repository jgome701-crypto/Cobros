function mesDetalle(off){
  const t=new Date();t.setDate(1);t.setMonth(t.getMonth()+off);
  const Y=t.getFullYear(),Mo=t.getMonth(),ym=Y+"-"+pad(Mo+1),dim=new Date(Y,Mo+1,0).getDate(),fo=(new Date(Y,Mo,1).getDay()+6)%7;
  const W={},wk=day=>Math.floor((day-1+fo)/7),get=w=>W[w]||(W[w]={items:[],esp:0,cob:0});
  let cob=0,ganCob=0,esp=0,ganEsp=0;
  for(const id of Object.keys(L)){
    const l=L[id],c=calc(l),tot=(+l.principal||0)+c.int,r=tot>0?c.int/tot:0;
    for(const x of l.pagos)if((x.d||"").startsWith(ym)){const w=get(wk(+x.d.slice(8,10)));w.cob+=x.amt;cob+=x.amt;ganCob+=x.amt*r}
    for(let k=1;k<=(+l.cuotas||0);k++){
      const d=new Date(l.start+"T00:00");d.setDate(d.getDate()+(+l.dias||7)*k);
      if(iso(d).startsWith(ym)){
        const cov=c.paid>=k*c.cuota-.5,w=get(wk(d.getDate()));
        w.items.push({name:l.name,amt:c.cuota,day:d.getDate(),cov,late:!cov&&iso(d)<today()});
        w.esp+=c.cuota;esp+=c.cuota;ganEsp+=c.cuota*r;
      }
    }
  }
  const largo=t.toLocaleDateString("es-CO",{month:"long"}),corto=largo.slice(0,3);
  const weeks=Object.keys(W).map(Number).sort((a,b)=>a-b).map(w=>{
    const a=Math.max(1,1+w*7-fo),b=Math.min(dim,(w+1)*7-fo),x=W[w];
    x.items.sort((p,q)=>p.day-q.day);
    return Object.assign({label:"Semana "+(w+1)+" · "+a+(b>a?"–"+b:"")+" "+corto},x);
  });
  return{nombre:largo+" "+Y,weeks,cob,ganCob,esp,ganEsp};
}

function simCalc(v){
  const m=+v.monto||0,r=+v.rate||0,q=+v.cuotas||0,d=+v.dias||0,cap=+v.cap||0;
  let n=Math.floor(+v.n)||0;if(!n)n=m>0?(cap>0?Math.floor(cap/m):1):0;
  const gan=m*r/100,cuota=q>0?(m+gan)/q:0,meses=q*d/30,gm=meses>0?gan/meses:0;
  return{n,m,gan,cuota,meses,gm,tot:n*m,ganT:n*gan,ganM:n*gm,recibir:n*(m+gan),over:cap>0?Math.max(0,n*m-cap):0};
}

function cumpl(arr){
  let ok=0,tarde=0,pend=0,sd=0;
  for(const l of arr){
    const c=calc(l),pg=[...l.pagos].sort((x,y)=>x.d<y.d?-1:1);let acc=0;const cum=pg.map(x=>(acc+=x.amt));
    for(let k=1;k<=(+l.cuotas||0);k++){
      const d=new Date(l.start+"T00:00");d.setDate(d.getDate()+(+l.dias||7)*k);const due=iso(d);
      const j=cum.findIndex(x=>x>=k*c.cuota-.5);
      if(j>=0){if(pg[j].d<=due)ok++;else{tarde++;sd+=diasEntre(pg[j].d,due)}}else if(due<today())pend++;
    }
  }
  return{ok,tarde,pend,prom:tarde?Math.round(sd/tarde):0};
}

async function activarAvisos(tipo,loanId){ // pide permiso, obtiene el token del celular y lo guarda para que lleguen los avisos
  try{
    if(!avisosOK()){alert("Este navegador no permite avisos. En iPhone primero instala la app en la pantalla de inicio.");return false}
    const perm=await Notification.requestPermission();
    if(perm!=="granted"){alert("No diste permiso para las notificaciones. Puedes activarlo en los ajustes del navegador.");return false}
    const {getMessaging,getToken,isSupported}=await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-messaging.js");
    if(!(await isSupported())){alert("Este celular no permite avisos desde el navegador.");return false}
    const reg=await navigator.serviceWorker.ready;
    const token=await getToken(getMessaging(app),{vapidKey:VAPID,serviceWorkerRegistration:reg});
    if(!token){alert("No se pudo activar el aviso. Intenta de nuevo.");return false}
    const id=(await sha(token+(loanId||auth.currentUser.uid))).slice(0,40);
    const data=tipo==="cliente"?{tipo:"cliente",loanId,token,creado:Date.now()}:{tipo:"prestamista",uid:auth.currentUser.uid,token,creado:Date.now()};
    try{await setDoc(doc(db,"tokens",id),data)}catch(x){} // si ya estaba registrado no pasa nada
    ls.set("cobros_push_"+(loanId||"owner"),"1");
    return true;
  }catch(x){alert("No se pudieron activar los avisos ("+(x.code||x.message||"error")+")");return false}
}
async function persist(id,loan){
  if(!auth.currentUser)throw new Error("Inicia sesión para guardar.");
  if(!loan.uid)loan.uid=auth.currentUser.uid;
  if(loan.uid!==auth.currentUser.uid)throw new Error("No puedes guardar datos de otra cuenta.");
  // Fallar de forma segura: nunca volver a guardar cédulas/fotos en el documento público.
  if(privOK!==true)throw new Error("No se pudo verificar el acceso a los datos privados. No se guardó nada; revisa las reglas de Firestore.");
  logAuto(loan,L[id]||TR[id]);
  const pub=Object.assign({},loan),ced=String(loan.cedula||"");
  delete pub.cedula;delete pub.fotos;delete pub.promesa;delete pub.dir;delete pub.hist;delete pub.geo;delete pub.visitas;delete pub.garantias;pub.cedulaUlt=ced.slice(-3);
  const bt=writeBatch(db);
  bt.set(doc(db,"prestamos",id),pub);
  bt.set(doc(db,"privados",id),{uid:loan.uid,cedula:ced,fotos:loan.fotos||[],promesa:loan.promesa||null,dir:loan.dir||"",hist:loan.hist||[],geo:loan.geo||null,visitas:loan.visitas||[],garantias:loan.garantias||[]});
  await race(bt.commit());
}

function pieSvg(d){
  const t=d.reduce((s,x)=>s+x.v,0),nz=d.filter(x=>x.v>0);let a=-Math.PI/2,h="";

  else{const w=nz.map(x=>Math.max(x.v/t,.04)),ws=w.reduce((q,y)=>q+y,0);nz.forEach((x,i)=>{const b=a+w[i]/ws*2*Math.PI;h+='<path d="M90 90L'+(90+82*Math.cos(a)).toFixed(2)+" "+(90+82*Math.sin(a)).toFixed(2)+"A82 82 0 "+(b-a>Math.PI?1:0)+" 1 "+(90+82*Math.cos(b)).toFixed(2)+" "+(90+82*Math.sin(b)).toFixed(2)+'Z" fill="'+x.c+'" style="stroke:var(--card);stroke-width:1.5"/>';a=b})}

    off+=lh.length+nm.length+d.length;

function xSheet(sp,first){

function sugHtml(n){
  const k=norm2(n);if(!k)return"";
  const arr=Object.keys(L).map(i=>L[i]).filter(x=>norm2(x.name)===k);
  if(!arr.length)return '<div class="note">💡 Primer préstamo para esta persona: empieza con un monto bajo.</div>';
  const s=cumpl(arr),tot=s.ok+s.tarde+s.pend,pct=tot?s.ok/tot:1,mx=Math.max(0,...arr.map(x=>+x.principal||0)),sube=Math.round(mx*1.2/10000)*10000;
  if(pct>=0.8)return '<div class="note ok">💡 Buen cumplimiento ('+Math.round(pct*100)+'% a tiempo). Límite sugerido: '+M(sube)+".</div>";
  if(pct>=0.5)return '<div class="note">💡 Cumplimiento regular ('+Math.round(pct*100)+'% a tiempo). Límite sugerido: '+M(mx)+".</div>";
  return '<div class="note late">⚠ Se atrasa mucho ('+Math.round(pct*100)+'% a tiempo). Mejor no prestarle más, o un monto bajo.</div>';
}

function timelineHtml(l){
  const nm=norm2(l.name),ev=[];
  Object.keys(L).forEach(id=>{const x=L[id];if(norm2(x.name)!==nm)return;const c=calc(x);
    if(x.start)ev.push({d:x.start,t:"Préstamo de "+M(x.principal)+" ("+x.cuotas+(x.cuotas==1?" cuota":" cuotas")+" cada "+x.dias+" días)"});
    (x.pagos||[]).forEach(p=>ev.push({d:p.d,t:"Pagó "+M(p.amt)+(p.n?" · "+p.n:"")}));
    if(x.start)sched(x,c).forEach(s=>{if(s.late)ev.push({d:s.d,t:"Cuota "+s.k+" atrasada ("+M(c.cuota)+")"})});
    if(x.promesa&&x.promesa.d)ev.push({d:x.promesa.d,t:"Promesa de pago"+(x.promesa.n?": "+x.promesa.n:"")});
    (x.visitas||[]).forEach(v=>ev.push({d:v.d,t:"Visita: "+v.nota}));
    (x.garantias||[]).forEach(g=>ev.push({d:g.d,t:"Garantía: "+g.desc+" ("+M(g.valor)+")"+(g.estado==="devuelta"?" · devuelta":"")}));
  });
  ev.sort((a,b)=>(b.d||"")<(a.d||"")?-1:(b.d||"")>(a.d||"")?1:0);
  return '<details class="pag"><summary>Línea de tiempo de '+esc(l.name)+" ("+ev.length+')<span class="more"></span></summary>'+(ev.length?ev.slice(0,80).map(e=>'<div class="row"><div>'+esc(e.t)+"<br><small>"+F(e.d)+"</small></div></div>").join(""):'<div class="empty">Sin movimientos</div>')+"</details>";
}

function riskHtml(n,ced,self){return riskBase(n,ced,self)+sugHtml(n)}
function riskBase(n,ced,self){
  const k=norm2(n);let cnt=0,d=0,a=0;
  Object.keys(L).forEach(id=>{const l=L[id];if(id===self)return;if((k&&norm2(l.name)===k)||(ced&&l.cedula&&String(l.cedula).trim()===String(ced).trim())){const c=calc(l);if(c.bal>0){cnt++;d+=c.bal;a+=Math.min(c.late,c.bal)}}});
  return cnt?'<div class="note'+(a>0?" late":"")+'">⚠ Ya tiene '+cnt+(cnt==1?" préstamo":" préstamos")+" sin pagar: debe "+M(d)+(a>0?" y está atrasado "+M(a):"")+".</div>":"";
}

function calBody(){
  const t=new Date();t.setDate(1);t.setMonth(t.getMonth()+calOff);
  const Y=t.getFullYear(),Mo=t.getMonth(),ym=Y+"-"+pad(Mo+1),dim=new Date(Y,Mo+1,0).getDate(),fo=(new Date(Y,Mo,1).getDay()+6)%7,D={};
  Object.keys(L).forEach(id=>{const l=L[id],c=calc(l);if(!l.start)return;sched(l,c).forEach(x=>{if(x.d.startsWith(ym)){const k=+x.d.slice(8);(D[k]=D[k]||[]).push({id,n:l.name,a:c.cuota,cov:x.cov,late:x.late})}})});
  let g='<div class="cal">'+["L","M","M","J","V","S","D"].map(w=>"<b>"+w+"</b>").join("")+"<i></i>".repeat(fo);
  for(let d=1;d<=dim;d++){const it=D[d]||[],k=ym+"-"+pad(d),col=!it.length?"":it.some(x=>x.late)?"#ff8a80":it.some(x=>!x.cov)?"var(--ac)":"var(--ok)";
    g+='<button class="'+(calDay===k?"":"ghost")+(k===today()?" hoy":"")+'" data-act="cal" data-k="'+k+'">'+d+(it.length?'<u style="background:'+col+'"></u>':"")+"</button>"}
  const sel=calDay.startsWith(ym)?(D[+calDay.slice(8)]||[]):[];
  return '<div class="bar" style="justify-content:space-between;align-items:center;margin:4px 0"><button class="ghost" data-act="cal-mes" data-d="-1" aria-label="Mes anterior">◀</button><b style="text-transform:capitalize">'+esc(t.toLocaleDateString("es-CO",{month:"long",year:"numeric"}))+'</b><button class="ghost" data-act="cal-mes" data-d="1" aria-label="Mes siguiente">▶</button></div>'+g+'</div><p class="sub"><span class="late">●</span> atrasada · <span style="color:var(--ac)">●</span> pendiente · <span class="ok">●</span> pagada</p>'
   +(calDay&&calDay.startsWith(ym)?"<h2>"+F(calDay)+"</h2>"+(sel.length?'<section class="cards" style="display:block">'+sel.map(i=>'<div class="sr"><span>'+esc(i.n)+"</span><span>"+M(i.a)+" · "+(i.cov?'<span class="ok">Pagada</span>':i.late?'<span class="late">Atrasada</span>':"Pendiente")+"</span></div>").join("")+"</section>":'<div class="empty">Nada para cobrar este día.</div>'):"");
}

function logAuto(nw,old){
  const h=(nw.hist=nw.hist||[]),add=x=>h.push({t:Date.now(),x}),sm=a=>a.reduce((t,x)=>t+x.amt,0);
  if(!old)add("Creó el préstamo");
  else{
    const dp=sm(nw.pagos)-sm(old.pagos),dg=sm(nw.gastos)-sm(old.gastos);
    if(nw.pagos.length>old.pagos.length)add("Pago registrado: "+M(dp));else if(nw.pagos.length<old.pagos.length)add("Pago eliminado: "+M(-dp));
    if(nw.gastos.length>old.gastos.length)add("Gasto registrado: "+M(dg));else if(nw.gastos.length<old.gastos.length)add("Gasto eliminado: "+M(-dg));
    if(["name","principal","rate","cuotas","dias","start","mora","tel","dir"].some(k=>String(nw[k]||"")!==String(old[k]||"")))add("Editó los datos del préstamo");
    if(JSON.stringify(nw.promesa||null)!==JSON.stringify(old.promesa||null))add(nw.promesa?"Promesa de pago para el "+F(nw.promesa.d):"Promesa de pago cerrada");
    if(!!nw.borrado!==!!old.borrado)add(nw.borrado?"Lo mandó a la papelera":"Lo restauró de la papelera");
  }
  if(h.length>100)h.splice(0,h.length-100);
}

async function avatarM(file){
  let bm=null,s,w,h;
  for(const o of [{resizeWidth:600,resizeQuality:"medium"},{}]){try{bm=await createImageBitmap(file,o);break}catch(x){}}
  if(bm){s=bm;w=bm.width;h=bm.height}
  else{s=await new Promise((ok,no)=>{const im=new Image(),u=URL.createObjectURL(file);im.onload=()=>{URL.revokeObjectURL(u);ok(im)};im.onerror=no;im.src=u});w=s.naturalWidth;h=s.naturalHeight}
  const m=Math.min(w,h),cv=document.createElement("canvas");cv.width=cv.height=256;
  cv.getContext("2d").drawImage(s,(w-m)/2,(h-m)/2,m,m,0,0,256,256);
  if(bm&&bm.close)bm.close();
  return cv.toDataURL("image/jpeg",.75);
}

function paintTop(){
  const a=R.querySelector('.xtop [data-x="perfil"]'),t=R.querySelector(".xtop b");
  if(a)a.innerHTML=perfil.foto?'<img src="'+esc(perfil.foto)+'" alt="">':USER;
  if(t)t.textContent=perfil.negocio||"Cobros";
}
function ownerView(){
  const h1=R.querySelector("h1"),nb=R.querySelector('[data-act="new"]');
  if(!(h1&&h1.textContent==="Mis préstamos"&&nb)){if(sheet==="notif")sheet=null;return}
  if(R.querySelector(".xtop"))return;
  const rs=R.querySelector("#rs"),sec=rs&&rs.closest("section"),pn=R.querySelector("#pn"),ps=pn&&pn.closest("section"),al=[];
  if(sec&&ps){let e=sec.nextElementSibling;while(e&&e!==ps){al.push(e);e=e.nextElementSibling}}
  const n=R.querySelectorAll(".al").length,bar=h1.parentElement,top=document.createElement("div");
  top.className="xtop";
  top.innerHTML='<button class="xib" data-x="perfil" aria-label="Mi perfil"></button><b></b><button class="xib" data-x="notif" aria-label="Notificaciones'+(n?" ("+n+")":"")+'">'+BELL+(n?'<i class="xdot"></i>':"")+"</button>";
  nb.textContent="＋ Nuevo préstamo";bar.replaceChildren(nb);bar.style.margin="0 0 8px";bar.before(top);paintTop();
  const sm=R.querySelector("#rs summary");
  if(sm){const t=sm.querySelector("b"),e=document.createElement("button");t.dataset.v=t.textContent;e.className="xeye";e.dataset.x="eye";e.setAttribute("aria-label","Mostrar u ocultar el monto");sm.prepend(e);paintEye()}
  const sh=document.createElement("div");sh.className="xsheet";sh.hidden=sheet!=="notif";
  sh.innerHTML='<div class="xbk" data-x="close"></div><div class="xsc"><div class="xhd"><h1>Notificaciones</h1><button class="ghost" data-x="close">Cerrar</button></div><div class="xal"></div></div>';
  const box=sh.querySelector(".xal");
  if(al.length)al.forEach(e=>box.append(e));else box.innerHTML='<p class="sub ok">Hoy no tienes cobros ni atrasos ✔</p>';
  R.append(sh);
}
function clientView(){
  if(!lend||R.querySelector(".xlend"))return;
  const h1=R.querySelector("h1");if(!h1||!(lend.nombre||lend.negocio))return;
  let w=String(lend.wa||"").replace(/\D/g,"");if(w.length===10)w="57"+w;
  const d=document.createElement("div");d.className="note xlend";
  d.innerHTML='<div class="xav">'+(lend.foto?'<img src="'+esc(lend.foto)+'" alt="">':USER)+'</div><div><b>'+esc(lend.nombre||lend.negocio)+"</b>"
   +(lend.nombre&&lend.negocio?"<br><small>"+esc(lend.negocio)+(lend.ciudad?" · "+esc(lend.ciudad):"")+"</small>":"")
   +(lend.pago?"<br><small>Para pagar: "+esc(lend.pago)+'</small><br><button class="ghost" style="margin-top:4px" data-x="copy-pago">📋 Copiar datos de pago</button>':"")
   +(w?'<br><a class="btn" style="margin-top:6px" target="_blank" rel="noopener" href="https://wa.me/'+w+"?text="+encodeURIComponent("Hola, te escribo por mi préstamo.")+'">Escribir por WhatsApp</a>':"")+"</div>";
  h1.before(d);
}
function enhance(){
  if(busy)return;busy=true;obs.disconnect();
  try{clientView()}catch(x){}
  obs.observe(R,{childList:true});busy=false;
}

const f=(id,l,v,x)=>'<label>'+l+'<input id="'+id+'" '+(x||'type="text"')+' value="'+esc(v||"")+'"></label>';
function openPerfil(){
  foto=perfil.foto||"";
  lay.innerHTML='<div class="xsheet"><div class="xbk" data-x="close"></div><div class="xsc"><div class="xhd"><h1>Mi perfil</h1><button class="ghost" data-x="close">Cerrar</button></div><div class="form"><div id="xp_av" class="xav">'+(foto?'<img src="'+esc(foto)+'" alt="">':USER)+'</div><label>Foto de perfil<input id="xp_f" type="file" accept="image/*"></label>'
   +f("xp_n","Tu nombre",perfil.nombre)+f("xp_neg","Nombre de tu negocio",perfil.negocio)+f("xp_ciu","Ciudad",perfil.ciudad)+f("xp_wa","Tu WhatsApp",perfil.wa,'type="tel" inputmode="tel"')+f("xp_pago","Cómo te pagan (Nequi, Daviplata, cuenta…)",perfil.pago)
   +'<small id="xp_m" class="sub"></small><button data-x="guardar">Guardar perfil</button></div><p class="sub">Tus clientes ven esto en su link.</p><div class="bar"><button class="ghost" data-x="salir">Salir</button></div></div></div>';
}
const closePerfil=()=>{lay.innerHTML=""};
async function avatar(file){
  let bm=null,s,w,h;
  for(const o of [{resizeWidth:600,resizeQuality:"medium"},{}]){try{bm=await createImageBitmap(file,o);break}catch(x){}}
  if(bm){s=bm;w=bm.width;h=bm.height}
  else{s=await new Promise((ok,no)=>{const im=new Image();im.onload=()=>ok(im);im.onerror=no;im.src=URL.createObjectURL(file)});w=s.naturalWidth;h=s.naturalHeight}
  const m=Math.min(w,h),cv=document.createElement("canvas");cv.width=cv.height=256;
  cv.getContext("2d").drawImage(s,(w-m)/2,(h-m)/2,m,m,0,0,256,256);
  return cv.toDataURL("image/jpeg",.75);
}

document.addEventListener("click",async e=>{
  const b=e.target.closest("[data-x]");if(!b)return;const a=b.dataset.x;
  if(a==="copy-pago"){try{await navigator.clipboard.writeText(lend.pago||"");b.textContent="¡Copiado!"}catch(x){b.textContent="Mantén presionado para copiar"}return}
  if(a==="eye"){e.preventDefault();hide=!hide;ls.set("cobros_hide",hide?"1":"0");return paintEye()}
  if(a==="notif"){sheet="notif";const s=R.querySelector(".xsheet");if(s)s.hidden=false;return}
  if(a==="perfil")return openPerfil();
  if(a==="close"){sheet=null;const s=R.querySelector(".xsheet");if(s)s.hidden=true;return closePerfil()}
  if(a==="salir"){closePerfil();return signOut(auth)}
  if(a==="guardar"){
    const g=id=>document.getElementById(id).value.trim(),m=document.getElementById("xp_m");
    perfil={nombre:g("xp_n"),negocio:g("xp_neg"),ciudad:g("xp_ciu"),wa:g("xp_wa"),pago:g("xp_pago"),foto};
    ls.set("cobros_perfil_"+uid,JSON.stringify(perfil));paintTop();dispatchEvent(new Event("perfil"));b.disabled=true;m.textContent="Guardando…";
    try{await Promise.race([setDoc(doc(db,"perfiles",uid),perfil),new Promise((_,no)=>setTimeout(()=>no({code:"sin respuesta"}),6000))]);m.textContent="Perfil guardado ✓"}
    catch(x){m.textContent="Se guardó en este celular, pero no se pudo publicar para tus clientes ("+(x.code||"error")+"). Falta actualizar las reglas de Firestore."}
    b.disabled=false;
  }
});
document.addEventListener("change",async e=>{
  if(e.target.id!=="xp_f")return;
  const file=e.target.files[0];e.target.value="";if(!file)return;
  const av=document.getElementById("xp_av"),m=document.getElementById("xp_m");
  try{foto=await avatar(file);av.innerHTML='<img src="'+esc(foto)+'" alt="">'}
  catch(x){m.textContent="No se pudo leer la foto. Elígela desde la galería (formato JPG o PNG)."}
});

onAuthStateChanged(auth,u=>{
  uid=u?u.uid:null;perfil={};
  if(u){
    try{perfil=JSON.parse(ls.get("cobros_perfil_"+u.uid)||"{}")}catch(x){}
    getDoc(doc(db,"perfiles",u.uid)).then(d=>{if(d.exists()){perfil=d.data();ls.set("cobros_perfil_"+u.uid,JSON.stringify(perfil));paintTop();dispatchEvent(new Event("perfil"))}}).catch(()=>{});
  }else closePerfil();
  paintTop();
});
const cid=new URLSearchParams(location.search).get("c");
if(cid)getDoc(doc(db,"prestamos",cid)).then(s=>s.exists()&&s.data().uid?getDoc(doc(db,"perfiles",s.data().uid)):null).then(d=>{if(d&&d.exists()){lend=d.data();enhance()}}).catch(()=>{});
obs.observe(R,{childList:true});enhance();
</script></body></html>
