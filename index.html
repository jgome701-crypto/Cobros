  if(!bioCredential||ls.get("cobros_bio_uid")!==(auth.currentUser&&auth.currentUser.uid))throw new Error("Vuelve a activar la huella desde Más opciones.");
  const challenge=randomBytes(),cred=await navigator.credentials.get({publicKey:{challenge,rpId:location.hostname,allowCredentials:[{type:"public-key",id:unb64u(bioCredential)}],userVerification:"required",timeout:60000}});
  if(!cred||b64u(cred.rawId)!==bioCredential)throw new Error("No se pudo verificar la huella.");
  const client=JSON.parse(new TextDecoder().decode(cred.response.clientDataJSON));
  if(client.type!=="webauthn.get"||client.origin!==location.origin||client.challenge!==b64u(challenge))throw new Error("La verificación biométrica no coincide.");
  locked=false;lockErr="";
}

function calc(l){
  const p=+l.principal||0,int=p*(+l.rate||0)/100,w=+l.cuotas||1,per=+l.dias||7,cuota=(p+int)/w;
  const g=l.gastos.reduce((s,x)=>s+x.amt,0),paid=l.pagos.reduce((s,x)=>s+x.amt,0);
  const days=l.start?Math.floor((Date.now()-new Date(l.start+"T00:00"))/864e5):0;
  const el=Math.max(0,Math.min(w,Math.floor(days/per)));
  const late=Math.max(0,el*cuota+g-paid),bal=p+int+g-paid;
  let next=null;if(l.start&&el<w){const d=new Date(l.start+"T00:00");d.setDate(d.getDate()+per*(el+1));next=iso(d)}
  return{int,g,paid,cuota,late,bal,next,pct:Math.min(100,Math.round(paid/((p+int+g)||1)*100))};
}

function semStats(off,det){
  const t=new Date();t.setHours(0,0,0,0);t.setDate(t.getDate()-((t.getDay()+6)%7)+off*7);
  const e=new Date(t);e.setDate(e.getDate()+6);
  const a=iso(t),b=iso(e);
  let esp=0,gan=0,cob=0,pend=0;const items=[];
  for(const id of Object.keys(L)){
    const l=L[id],c=calc(l),tot=(+l.principal||0)+c.int,r=tot>0?c.int/tot:0;
    for(const x of l.pagos)if(x.d>=a&&x.d<=b)cob+=x.amt;
    for(let k=1;k<=(+l.cuotas||0);k++){
      const d=new Date(l.start+"T00:00");d.setDate(d.getDate()+(+l.dias||7)*k);const di=iso(d);
      if(di>=a&&di<=b){const cov=c.paid>=k*c.cuota-.5;esp+=c.cuota;gan+=c.cuota*r;if(!cov)pend+=c.cuota;if(det)items.push({id,name:l.name,amt:c.cuota,rem:Math.max(0,Math.min(c.cuota,k*c.cuota-c.paid)),d:di,cov,late:!cov&&di<today()})}
    }
  }
  const f=d=>d.toLocaleDateString("es-CO",{day:"numeric",month:"short"});
  items.sort((p,q)=>p.d<q.d?-1:1);
  return{label:f(t)+" – "+f(e),esp,gan,cob,pend,items};
}

function mesDetalle(off){
  const t=new Date();t.setDate(1);t.setMonth(t.getMonth()+off);
  const Y=t.getFullYear(),Mo=t.getMonth(),ym=Y+"-"+pad(Mo+1),dim=new Date(Y,Mo+1,0).getDate(),fo=(new Date(Y,Mo,1).getDay()+6)%7;
  const W={},wk=day=>Math.floor((day-1+fo)/7),get=w=>W[w]||(W[w]={items:[],esp:0,cob:0});
  let cob=0,ganCob=0,esp=0,ganEsp=0;
  for(const id of Object.keys(L)){
    const l=L[id],c=calc(l),tot=(+l.principal||0)+c.int,r=tot>0?c.int/tot:0;
    for(const x of l.pagos)if((x.d||"").startsWith(ym)){const w=get(wk(+x.d.slice(8,10)));w.cob+=x.amt;cob+=x.amt;ganCob+=x.amt*r}
    for(let k=1;k<=(+l.cuotas||0);k++){
      const d=new Date(l.start+"T00:00");d.setDate(d.getDate()+(+l.dias||7)*k);
      if(iso(d).startsWith(ym)){
        const cov=c.paid>=k*c.cuota-.5,w=get(wk(d.getDate()));
        w.items.push({name:l.name,amt:c.cuota,day:d.getDate(),cov,late:!cov&&iso(d)<today()});
        w.esp+=c.cuota;esp+=c.cuota;ganEsp+=c.cuota*r;
      }
    }
  }
  const largo=t.toLocaleDateString("es-CO",{month:"long"}),corto=largo.slice(0,3);
  const weeks=Object.keys(W).map(Number).sort((a,b)=>a-b).map(w=>{
    const a=Math.max(1,1+w*7-fo),b=Math.min(dim,(w+1)*7-fo),x=W[w];
    x.items.sort((p,q)=>p.day-q.day);
    return Object.assign({label:"Semana "+(w+1)+" · "+a+(b>a?"–"+b:"")+" "+corto},x);
  });
  return{nombre:largo+" "+Y,weeks,cob,ganCob,esp,ganEsp};
}

function simCalc(v){

  let n=Math.floor(+v.n)||0;if(!n)n=m>0?(cap>0?Math.floor(cap/m):1):0;
  const gan=m*r/100,cuota=q>0?(m+gan)/q:0,meses=q*d/30,gm=meses>0?gan/meses:0;
  return{n,m,gan,cuota,meses,gm,tot:n*m,ganT:n*gan,ganM:n*gm,recibir:n*(m+gan),over:cap>0?Math.max(0,n*m-cap):0};
}

    h+='<section class="cards plan"><div><span>Cuota</span><b>'+M(c.cuota)+'</b></div><div><span>Plazo</span><b>'+esc(l.cuotas)+(l.cuotas==1?" cuota":" cuotas")+'</b><span>'+cadaTxt(+l.dias)+'</span></div>'

  if(owner&&l.name)h+='<div class="bar"><button class="ghost" data-act="'+(askDel?"del-loan":"ask-del")+'">'+(askDel?"Toca otra vez para mandarlo a la papelera":"Eliminar préstamo")+"</button></div>";
  if(zoom>=0&&l.fotos[zoom])h+='<div class="zoom" data-act="unzoom"><img src="'+l.fotos[zoom]+'" alt="Foto"></div>';
  $.innerHTML=h;
}

async function migrar(){ // una sola vez: marca como tuyos los préstamos viejos que no tenían dueño
  if(localStorage.getItem("cobros_mig1"))return;
  try{
    const sn=await getDocs(collection(db,"prestamos")),bt=writeBatch(db);let n=0;
    sn.forEach(d=>{if(!d.data().uid){bt.update(d.ref,{uid:ADMIN});n++}});
    if(n)await bt.commit();
    localStorage.setItem("cobros_mig1","1");
  }catch(x){}
}

 const body='<div class="auth-form">'+inp("f_e","Correo electrónico","email","","autocomplete=\"email\" placeholder=\"tucorreo@ejemplo.com\"")+inp("f_pw","Crear contraseña","password","","autocomplete=\"new-password\" placeholder=\"Crea una contraseña segura\"")+ '<div class="pw-meter"><span id="pw_bar"></span></div><div id="pw_score" class="auth-note">Seguridad de la contraseña: sin evaluar</div><div class="pw-reqs"><div class="pw-req" data-pw="len"><b>✓</b> Al menos 8 caracteres</div><div class="pw-req" data-pw="upper"><b>✓</b> Una letra mayúscula (A–Z)</div><div class="pw-req" data-pw="lower"><b>✓</b> Una letra minúscula (a–z)</div><div class="pw-req" data-pw="num"><b>✓</b> Un número (0–9)</div><div class="pw-req" data-pw="sym"><b>✓</b> Un símbolo (!@#$...)</div><div class="pw-req" data-pw="long"><b>✓</b> 12 caracteres o más (recomendado)</div></div>'+inp("f_pw2","Confirmar contraseña","password","","autocomplete=\"new-password\" placeholder=\"Repite la contraseña\"")+(m?'<div class="auth-error">'+esc(m)+"</div>":"")+'<button class="auth-primary" data-act="register">CREAR CUENTA</button><button class="auth-secondary" data-act="back-login">Volver al inicio de sesión</button><p class="auth-note">La creación de cuenta requiere una invitación válida. Usa una contraseña única que no utilices en otros sitios.</p></div>';

function updatePasswordStrength(){
 const el=document.getElementById("f_pw");if(!el)return;
 const p=el.value,checks={len:p.length>=8,upper:/[A-Z]/.test(p),lower:/[a-z]/.test(p),num:/[0-9]/.test(p),sym:/[^A-Za-z0-9]/.test(p),long:p.length>=12};
 document.querySelectorAll("[data-pw]").forEach(x=>{const ok=!!checks[x.dataset.pw];x.classList.toggle("good",ok);x.querySelector("b").textContent=ok?"✓":"·"});
 const n=Object.values(checks).filter(Boolean).length,bar=document.getElementById("pw_bar"),score=document.getElementById("pw_score");
 if(bar){bar.style.width=(n/6*100)+"%";bar.style.background=n>=5?"#43c88b":n>=3?"#d4af37":"#ef6868"}
 if(score)score.textContent="Seguridad: "+(n===6?"Muy fuerte":n>=5?"Fuerte":n>=3?"Media":p?"Débil":"sin evaluar");
}

async function save(loan){
  err="";
  try{await persist(cur.id,loan);cur.loan=loan;delete cur.draft;L[cur.id]=loan;form=null;renewBal=0}
  catch(e){err="No se pudo guardar ("+(e.code||"error")+"). Revisa tu conexión e intenta de nuevo."}
  view();
}
function rebuild(){
  L={};TR={};for(const id of Object.keys(RAW)){const p=P[id],x=norm(Object.assign({},RAW[id],p?{cedula:p.cedula||"",fotos:p.fotos||[],promesa:p.promesa||RAW[id].promesa||null,dir:p.dir||RAW[id].dir||"",hist:p.hist||RAW[id].hist||[]}:{}));applyQueuedPayments(x,id);(x.borrado?TR:L)[id]=x}
  if(cur&&!cur.draft){if(L[cur.id])cur.loan=L[cur.id];else cur=null}
  if(!form)view();
  migrarPriv();
}
async function migrarPriv(){ // mueve cédula y fotos viejas a un documento privado (solo el dueño lo lee)
  if(privOK!==true||migPriv)return;
  const falt=Object.keys(RAW).filter(id=>(RAW[id].cedula||(RAW[id].fotos&&RAW[id].fotos.length))&&!P[id]);
  if(!falt.length)return;migPriv=true;
  try{for(let i=0;i<falt.length;i+=4){const bt=writeBatch(db);falt.slice(i,i+4).forEach(id=>{const r=RAW[id];bt.set(doc(db,"privados",id),{uid:r.uid||auth.currentUser.uid,cedula:r.cedula||"",fotos:r.fotos||[]});bt.update(doc(db,"prestamos",id),{cedula:deleteField(),fotos:deleteField(),cedulaUlt:String(r.cedula||"").slice(-3)})});await bt.commit()}}catch(x){}
}

const _crcT=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let k=n;for(let i=0;i<8;i++)k=k&1?0xEDB88320^(k>>>1):k>>>1;t[n]=k>>>0}return t})();
const _crc=b=>{let k=0xFFFFFFFF;for(let i=0;i<b.length;i++)k=_crcT[(k^b[i])&255]^(k>>>8);return(k^0xFFFFFFFF)>>>0};
function zipStore(files){
  const te=new TextEncoder(),parts=[],cen=[];let off=0;
  const u16=v=>[v&255,(v>>8)&255],u32=v=>[v&255,(v>>8)&255,(v>>16)&255,(v>>>24)&255];
  files.forEach(f=>{
    const nm=te.encode(f.n),d=te.encode(f.d),cr=_crc(d);
    const lh=new Uint8Array([0x50,0x4b,3,4,...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(0x21),...u32(cr),...u32(d.length),...u32(d.length),...u16(nm.length),...u16(0)]);
    parts.push(lh,nm,d);
    cen.push(new Uint8Array([0x50,0x4b,1,2,...u16(20),...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(0x21),...u32(cr),...u32(d.length),...u32(d.length),...u16(nm.length),...u16(0),...u16(0),...u16(0),...u16(0),...u32(0),...u32(off)]),nm);
    off+=lh.length+nm.length+d.length;
  });
  const cs=cen.reduce((t,x)=>t+x.length,0);
  parts.push(...cen,new Uint8Array([0x50,0x4b,5,6,0,0,0,0,...u16(files.length),...u16(files.length),...u32(cs),...u32(off),0,0]));
  return new Blob(parts,{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
}
const COLL=n=>{let s="";n++;while(n>0){const r=(n-1)%26;s=String.fromCharCode(65+r)+s;n=Math.floor((n-1)/26)}return s};
const xe=t=>String(t==null?"":t).replace(/[\u0000-\u0008\u000b\u000c\u000e-\u001f]/g,"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const serialF=d=>{const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(d||"");return m?(Date.UTC(+m[1],+m[2]-1,+m[3])-Date.UTC(1899,11,30))/864e5:null};
const XNS='xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"',XH='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>';
function xStyles(){
  const xf=(nf,f,fi,b,al)=>'<xf numFmtId="'+nf+'" fontId="'+f+'" fillId="'+fi+'" borderId="'+b+'" xfId="0" applyNumberFormat="1" applyFont="1" applyFill="1" applyBorder="1" applyAlignment="1"><alignment '+al+"/></xf>";
  const vc='vertical="center"',cc='horizontal="center" vertical="center"';
  const fnt=(b,col)=>"<font>"+(b?"<b/>":"")+'<sz val="11"/>'+(col?'<color rgb="'+col+'"/>':"")+'<name val="Calibri"/></font>';
  const fill=c=>'<fill><patternFill patternType="solid"><fgColor rgb="'+c+'"/><bgColor indexed="64"/></patternFill></fill>';
  return XH+"<styleSheet "+XNS+'><numFmts count="2"><numFmt numFmtId="164" formatCode="&quot;$&quot; #,##0"/><numFmt numFmtId="165" formatCode="dd/mm/yyyy"/></numFmts>'
   +'<fonts count="7">'+fnt(0)+fnt(1,"FFFFFFFF")+fnt(0)+fnt(1,"FF9C0006")+fnt(1,"FF006100")+fnt(1,"FF1F3864")+fnt(1)+"</fonts>"
   +'<fills count="8"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill>'+fill("FF1F3864")+fill("FFF2F2F2")+fill("FFFFC7CE")+fill("FFC6EFCE")+fill("FFDDEBF7")+fill("FFFFF2CC")+"</fills>"
   +'<borders count="2"><border><left/><right/><top/><bottom/><diagonal/></border><border><left style="thin"><color rgb="FFD9D9D9"/></left><right style="thin"><color rgb="FFD9D9D9"/></right><top style="thin"><color rgb="FFD9D9D9"/></top><bottom style="thin"><color rgb="FFD9D9D9"/></bottom><diagonal/></border></borders>'
   +'<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="15">'
   +xf(0,0,0,0,vc)+xf(0,1,2,1,'horizontal="center" vertical="center" wrapText="1"')+xf(0,0,0,1,vc)+xf(0,0,3,1,vc)+xf(164,0,0,1,vc)+xf(164,0,3,1,vc)+xf(165,0,0,1,cc)+xf(165,0,3,1,cc)+xf(0,0,0,1,cc)+xf(0,0,3,1,cc)
   +xf(0,3,4,1,cc)+xf(0,4,5,1,cc)+xf(0,5,6,1,cc)+xf(0,6,7,1,vc)+xf(164,6,7,1,vc)
   +'</cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>';
}
function xSheet(sp,first){
  const SM={txt:[2,3],money:[4,5],date:[6,7],int:[8,9]};
  const txt=(r,s,v)=>v===""||v==null?'<c r="'+r+'" s="'+s+'"/>':'<c r="'+r+'" s="'+s+'" t="inlineStr"><is><t xml:space="preserve">'+xe(v)+"</t></is></c>";
  const num=(r,s,v)=>Number.isFinite(+v)&&v!==""&&v!=null?'<c r="'+r+'" s="'+s+'"><v>'+(+v)+"</v></c>":'<c r="'+r+'" s="'+s+'"/>';
  let x=XH+"<worksheet "+XNS+'><sheetViews><sheetView showGridLines="0" workbookViewId="0"'+(first?' tabSelected="1"':"")+'><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/><selection pane="bottomLeft"/></sheetView></sheetViews><sheetFormatPr defaultRowHeight="18"/><cols>'
   +sp.cols.map((c,i)=>'<col min="'+(i+1)+'" max="'+(i+1)+'" width="'+c.w+'" customWidth="1"/>').join("")+'</cols><sheetData><row r="1" ht="30" customHeight="1">'
   +sp.cols.map((c,i)=>txt(COLL(i)+"1",1,c.h)).join("")+"</row>";
  sp.rows.forEach((row,ri)=>{
    const band=ri%2,R=ri+2;
    x+='<row r="'+R+'" ht="20" customHeight="1">'+sp.cols.map((col,ci)=>{
      const cv=Array.isArray(row[ci])?row[ci]:[col.t,row[ci]],t=cv[0],v=cv[1],ref=COLL(ci)+R;
      if(t==="est")return txt(ref,/atras/i.test(v)?10:/pagad/i.test(v)?11:12,v);
      const s=SM[t][band];
      if(t==="txt")return txt(ref,s,v);
      if(t==="date"){const n=serialF(v);return num(ref,s,n==null?"":n)}
      return num(ref,s,v);
    }).join("")+"</row>";
  });
  if(sp.total&&sp.rows.length){
    const R=sp.rows.length+2;
    x+='<row r="'+R+'" ht="22" customHeight="1">'+sp.cols.map((col,ci)=>{
      const ref=COLL(ci)+R;
      if(ci===0)return txt(ref,13,"TOTAL");
      if(sp.total.sum.includes(ci))return num(ref,14,sp.rows.reduce((t,r)=>t+(+r[ci]||0),0));
      return '<c r="'+ref+'" s="13"/>';
    }).join("")+"</row>";
  }
  return x+"</sheetData></worksheet>";
}
function xlsx(hojas){
  const n=hojas.length,RN="http://schemas.openxmlformats.org/officeDocument/2006/relationships",PR="http://schemas.openxmlformats.org/package/2006/relationships";
  const files=[
    {n:"[Content_Types].xml",d:XH+'<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>'+hojas.map((h,i)=>'<Override PartName="/xl/worksheets/sheet'+(i+1)+'.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>').join("")+"</Types>"},
    {n:"_rels/.rels",d:XH+'<Relationships xmlns="'+PR+'"><Relationship Id="rId1" Type="'+RN+'/officeDocument" Target="xl/workbook.xml"/></Relationships>'},
    {n:"xl/workbook.xml",d:XH+"<workbook "+XNS+' xmlns:r="'+RN+'"><sheets>'+hojas.map((h,i)=>'<sheet name="'+xe(h.name)+'" sheetId="'+(i+1)+'" r:id="rId'+(i+1)+'"/>').join("")+"</sheets></workbook>"},
    {n:"xl/_rels/workbook.xml.rels",d:XH+'<Relationships xmlns="'+PR+'">'+hojas.map((h,i)=>'<Relationship Id="rId'+(i+1)+'" Type="'+RN+'/worksheet" Target="worksheets/sheet'+(i+1)+'.xml"/>').join("")+'<Relationship Id="rId'+(n+1)+'" Type="'+RN+'/styles" Target="styles.xml"/></Relationships>'},
    {n:"xl/styles.xml",d:xStyles()}
  ];
  hojas.forEach((h,i)=>files.push({n:"xl/worksheets/sheet"+(i+1)+".xml",d:xSheet(h,i===0)}));
  return zipStore(files);
}
function bajarXlsx(nombre,hojas){const u=URL.createObjectURL(xlsx(hojas)),a=document.createElement("a");a.href=u;a.download=nombre;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000)}
const estadoL=c=>c.bal<=0?"Pagado":c.late>0?"Atrasado":"Al día";
function hojaResumen(){
  const ids=Object.keys(L),cs=ids.map(id=>calc(L[id])),sm=f=>Math.round(cs.reduce((t,c,i)=>t+f(c,L[ids[i]]),0));
  return{name:"Resumen",cols:[{h:"Concepto",w:34,t:"txt"},{h:"Valor",w:22,t:"money"}],rows:[
    ["Fecha del reporte",["date",today()]],["Préstamos registrados",["int",ids.length]],["Préstamos activos",["int",cs.filter(c=>c.bal>0).length]],
    ["Total prestado",sm((c,l)=>+l.principal||0)],["Ganancia (intereses)",sm(c=>c.int)],["Ya cobrado",sm(c=>c.paid)],
    ["Plata en la calle (por cobrar)",sm(c=>Math.max(0,c.bal))],["Atrasado",sm(c=>c.bal>0?Math.min(c.late,c.bal):0)]]};
}
function hojaPrest(){
  const rk={"Atrasado":0,"Al día":1,"Pagado":2};
  const rows=Object.keys(L).map(id=>{const l=L[id],c=calc(l),e=estadoL(c);return{e,r:[l.name,l.cedula||"",l.tel||"",l.start,+l.principal||0,+l.rate||0,Math.round(c.int),+l.cuotas||0,+l.dias||7,Math.round(c.cuota),c.paid,c.g,Math.round(c.bal),c.bal>0?c.next||"":"",e]}});
  rows.sort((a,b)=>rk[a.e]-rk[b.e]||String(a.r[0]).localeCompare(String(b.r[0])));
  return{name:"Préstamos",cols:[{h:"Nombre",w:24,t:"txt"},{h:"Cédula",w:14,t:"txt"},{h:"Celular",w:16,t:"txt"},{h:"Fecha del préstamo",w:16,t:"date"},{h:"Prestado",w:15,t:"money"},{h:"Interés %",w:10,t:"int"},{h:"Interés $",w:14,t:"money"},{h:"Cuotas",w:9,t:"int"},{h:"Cada (días)",w:11,t:"int"},{h:"Valor cuota",w:14,t:"money"},{h:"Pagado",w:14,t:"money"},{h:"Gastos",w:13,t:"money"},{h:"Saldo",w:15,t:"money"},{h:"Próximo cobro",w:15,t:"date"},{h:"Estado",w:12,t:"est"}],rows:rows.map(x=>x.r),total:{sum:[4,6,10,11,12]}};
}
function hojaCuotas(){
  const r=[];Object.keys(L).forEach(id=>{const l=L[id],c=calc(l);if(!l.start)return;sched(l,c).forEach(x=>r.push([x.d,l.name,l.start,x.k,Math.round(c.cuota),x.cov?"Pagada":x.late?"Atrasada":"Pendiente"]))});
  r.sort((a,b)=>a[0]<b[0]?-1:a[0]>b[0]?1:String(a[1]).localeCompare(String(b[1])));
  return{name:"Cuotas",cols:[{h:"Fecha de cobro",w:16,t:"date"},{h:"Cliente",w:24,t:"txt"},{h:"Préstamo del",w:15,t:"date"},{h:"Cuota #",w:9,t:"int"},{h:"Valor cuota",w:15,t:"money"},{h:"Estado",w:13,t:"est"}],rows:r};
}
function hojaPagos(){
  const r=[];Object.keys(L).forEach(id=>L[id].pagos.forEach(x=>r.push([x.d,L[id].name,x.amt,x.n||""])));
  r.sort((a,b)=>a[0]<b[0]?1:a[0]>b[0]?-1:0);
  return{name:"Pagos",cols:[{h:"Fecha",w:15,t:"date"},{h:"Persona",w:26,t:"txt"},{h:"Monto",w:16,t:"money"},{h:"Nota",w:28,t:"txt"}],rows:r,total:{sum:[2]}};
}
function hojaGastos(){
  const r=[];Object.keys(L).forEach(id=>L[id].gastos.forEach(x=>r.push([x.d,L[id].name,x.desc||"",x.amt])));
  r.sort((a,b)=>a[0]<b[0]?1:a[0]>b[0]?-1:0);

}

function calBody(){

   +(calDay&&calDay.startsWith(ym)?"<h2>"+F(calDay)+"</h2>"+(sel.length?'<section class="cards" style="display:block">'+sel.map(i=>'<div class="sr"><span>'+esc(i.n)+"</span><span>"+M(i.a)+" · "+(i.cov?'<span class="ok">Pagada</span>':i.late?'<span class="late">Atrasada</span>':"Pendiente")+"</span></div>").join("")+"</section>":'<div class="empty">Nada para cobrar este día.</div>'):"");
}

function papeleraHtml(){

function logAuto(nw,old){
  const h=(nw.hist=nw.hist||[]),add=x=>h.push({t:Date.now(),x}),sm=a=>a.reduce((t,x)=>t+x.amt,0);
  if(!old)add("Creó el préstamo");
  else{
    const dp=sm(nw.pagos)-sm(old.pagos),dg=sm(nw.gastos)-sm(old.gastos);
    if(nw.pagos.length>old.pagos.length)add("Pago registrado: "+M(dp));else if(nw.pagos.length<old.pagos.length)add("Pago eliminado: "+M(-dp));
    if(nw.gastos.length>old.gastos.length)add("Gasto registrado: "+M(dg));else if(nw.gastos.length<old.gastos.length)add("Gasto eliminado: "+M(-dg));
    if(["name","principal","rate","cuotas","dias","start","mora","tel","dir"].some(k=>String(nw[k]||"")!==String(old[k]||"")))add("Editó los datos del préstamo");
    if(JSON.stringify(nw.promesa||null)!==JSON.stringify(old.promesa||null))add(nw.promesa?"Promesa de pago para el "+F(nw.promesa.d):"Promesa de pago cerrada");
    if(!!nw.borrado!==!!old.borrado)add(nw.borrado?"Lo mandó a la papelera":"Lo restauró de la papelera");
  }
  if(h.length>100)h.splice(0,h.length-100);
}

      const payment={d:v("f_d"),amt,n:v("f_t").trim()};pendingRec={id:cur.id,amt,d:v("f_d")};
      if(!navigator.onLine){payment.offlineId=newId();queueOfflinePayment(cur.id,payment);l.pagos.push(payment);l.pagos.sort((x,y)=>x.d<y.d?-1:1);L[cur.id]=l;cur.loan=l;form=null;err="Pago guardado en este celular. Se sincronizará cuando vuelva internet.";return view()}
      l.pagos.push(payment);
    }
    else{if(!v("f_t").trim()){err="Escribe una descripción.";return view()}l.gastos.push({d:v("f_d"),amt,desc:v("f_t").trim()})}
    l.pagos.sort((x,y)=>x.d<y.d?-1:1);l.gastos.sort((x,y)=>x.d<y.d?-1:1);
  }else if(a==="del-pago"||a==="del-gasto"){
    if(!confirm("¿Eliminar este registro?"))return;
    l[a==="del-pago"?"pagos":"gastos"].splice(+b.dataset.i,1);
  }else if(a==="total-ok"){
    const t=totalInfo(l,qd);if(!(t.pagar>0)&&!(t.ds>0))return;
    if(t.pagar>0)l.pagos.push({d:today(),amt:Math.round(t.pagar),n:"Cancelación total"+(qd>0?" (desc. "+qd+"%)":"")});
    if(t.ds>0)l.gastos.push({d:today(),amt:-Math.round(t.ds),desc:"Descuento por pago total"});
    pendingRec={id:cur.id,amt:Math.round(t.pagar),d:today()};qm="";
  }else if(a==="prom-save"){
    const d=v("p_d");if(!d){err="Elige la fecha.";return view()}
    l.promesa={d,n:v("p_n").trim()};qm="";
  }else return;
  b.disabled=true;await save(l);
  if(a==="save-setup"&&!err&&cur&&cur.refi){const o=L[cur.refi];if(o){const ol=structuredClone(o),bl=calc(ol).bal;if(bl>0){ol.pagos.push({d:today(),amt:bl,n:"Refinanciado"});try{await persist(cur.refi,ol);L[cur.refi]=ol;RAW[cur.refi]=Object.assign({},RAW[cur.refi]||{},{pagos:ol.pagos})}catch(x){}}}delete cur.refi;view()}
  if(pendingRec){if(!err)lastPay=pendingRec;pendingRec=null;view()}
});
$.addEventListener("change",async e=>{
  if(e.target.id==="c_f"){const f=e.target.files[0],m=document.getElementById("c_m"),pv=document.getElementById("c_prev");e.target.value="";if(!f)return;try{cmpImg=await shrink(f);pv.innerHTML='<img src="'+cmpImg+'" style="width:120px;height:120px;object-fit:cover;border-radius:10px" alt="Vista previa">';m.textContent=""}catch(x){cmpImg="";m.textContent="No se pudo leer la foto. Elígela desde la galería."}return}
  if(e.target.id!=="f_f")return;

  prev();const m=document.getElementById("f_msg");
  if(m)m.textContent=full?"Máximo 4 fotos. Quita una (✕) para agregar otra.":bad?"No se pudo leer "+bad+" foto(s). Si la tomaste con la cámara, elígela desde la galería o toma la foto en formato JPG.":"";
});
$.addEventListener("input",e=>{
  if(e.target.id==="f_n"||e.target.id==="f_c"){const o=document.getElementById("f_risk"),g=id=>(document.getElementById(id)||{value:""}).value.trim();if(o)o.innerHTML=riskHtml(g("f_n"),g("f_c"),cur&&cur.id);return}
  if(e.target.id==="q_d"){qd=Math.min(100,Math.max(0,+e.target.value||0));const o=document.getElementById("q_tot");if(o&&cur)o.textContent=M(totalInfo(cur.loan,qd).pagar);return}
  if(e.target.id==="q_busca"){busca=e.target.value;const o=document.getElementById("lista");if(o)o.innerHTML=nav==="clientes"?clientesLista():listaHtml();return}
  if(["f_p","f_r","f_w","f_k","f_d"].includes(e.target.id)){
    const o=document.getElementById("f_sim"),g=id=>+(document.getElementById(id)||{}).value||0;
    if(o)o.innerHTML=newSimHtml(g("f_p"),g("f_r"),g("f_w"),g("f_k")||7,(document.getElementById("f_d")||{}).value||today());
    return;
  }
  const k={s_cap:"cap",s_monto:"monto",s_n:"n",s_rate:"rate",s_cuotas:"cuotas",s_dias:"dias"}[e.target.id];
  if(!k)return;simv[k]=e.target.value;const o=document.getElementById("sim_out");if(o)o.innerHTML=simHtml();
});
$.addEventListener("toggle",e=>{if(e.target.id==="sch")showSch=e.target.open;if(e.target.id==="sim")showSim=e.target.open;if(e.target.id==="wk")showWk=e.target.open;if(e.target.id==="sw")showWeek=e.target.open;if(e.target.id==="pn")showTabs=e.target.open;if(e.target.id==="rs")showRes=e.target.open;if(e.target.id==="pag")showPag=e.target.open;if(e.target.id==="ms")showMas=e.target.open},true);
$.addEventListener("input",e=>{if(e.target&&e.target.id==="f_pw"&&document.querySelector(".pw-reqs"))updatePasswordStrength()});
$.addEventListener("keydown",e=>{if(e.key==="Enter"&&(e.target.id==="f_pw"||e.target.id==="f_pw2"||e.target.id==="f_pin")){const bt=document.querySelector('[data-act="login"]')||document.querySelector('[data-act="register"]')||document.querySelector('[data-act="unlock"]');if(bt)bt.click()}});

// ---- Arranque ----
const c=q.get("c");
document.addEventListener("visibilitychange",()=>{if(document.hidden)hiddenAt=Date.now();else {if((pinHash||bioCredential)&&owner&&hiddenAt&&Date.now()-hiddenAt>60000){locked=true;view()}if(navigator.onLine)syncOfflinePayments()}});
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferredInstall=e;if(!owner&&cur)view()});
if(c){ // vista del cliente: solo lectura, sin sesión
  try{ // manifiesto propio: la app instalada se abre directo en el préstamo de este cliente
    const base=location.origin+location.pathname.replace(/[^/]*$/,""),start=base+"?c="+encodeURIComponent(c);
    const mf={name:"Mi préstamo",short_name:"Mi préstamo",id:start,start_url:start,scope:base,display:"standalone",background_color:"#0a0a0a",theme_color:"#0a0a0a",
      icons:[{src:base+"icon-192.png",sizes:"192x192",type:"image/png",purpose:"any"},{src:base+"icon-512.png",sizes:"512x512",type:"image/png",purpose:"any"},{src:base+"maskable-512.png",sizes:"512x512",type:"image/png",purpose:"maskable"}]};
    const lk=document.querySelector('link[rel="manifest"]');if(lk)lk.href=URL.createObjectURL(new Blob([JSON.stringify(mf)],{type:"application/manifest+json"}));
  }catch(x){}
  onSnapshot(doc(db,"prestamos",c),
    s=>{if(s.exists()&&!s.data().borrado){cur={id:c,loan:norm(s.data())};view()}else $.innerHTML=msg("No encontramos este préstamo. Revisa el enlace.")},
    ()=>$.innerHTML=msg("No se pudo cargar. Intenta de nuevo."));
}else if(rcode){registerFlow()}else startOwner();
function startOwner(){
  onAuthStateChanged(auth,u=>{
    if(unsub){unsub();unsub=null}if(unsub2){unsub2();unsub2=null}if(unsub3){unsub3();unsub3=null}CMP={};
    if(!u){owner=false;L={};RAW={};P={};privOK=null;migPriv=false;cur=null;form=null;lastPay=null;locked=!!pinHash||!!bioCredential;return askLogin()}
    owner=true;
    if(u.uid===ADMIN)migrar();
    unsub2=onSnapshot(query(collection(db,"privados"),where("uid","==",u.uid)),
      s=>{P={};s.forEach(d=>P[d.id]=d.data());privOK=true;rebuild();syncOfflinePayments()},
      ()=>{P={};privOK=false;rebuild()});
    unsub3=onSnapshot(query(collection(db,"comprobantes"),where("uid","==",u.uid)),s=>{CMP={};s.forEach(d=>CMP[d.id]=d.data());if(!form)view()},()=>{});
    unsub=onSnapshot(query(collection(db,"prestamos"),where("uid","==",u.uid)),
      s=>{RAW={};s.forEach(d=>RAW[d.id]=d.data());rebuild()},
      e=>$.innerHTML=msg("No se pudo leer los datos ("+esc(e.code)+"). Revisa las reglas de Firestore."));
    if(navigator.onLine)syncOfflinePayments();
  });
}
</script>
<script type="module">
import {getApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,doc,getDoc,setDoc} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const app=getApp(),auth=getAuth(app),db=getFirestore(app),R=document.getElementById("root");
const ls={get:k=>{try{return localStorage.getItem(k)}catch(x){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(x){}}};
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const S=d=>'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+d+'</svg>';
const USER=S('<circle cx="12" cy="8" r="3.5"/><path d="M5 20a7 7 0 0 1 14 0"/>');
const BELL=S('<path d="M6 17v-6a6 6 0 0 1 12 0v6M4 17h16M10 20.5h4"/>');
const EYE=S('<path d="M2 12s3.5-6.5 10-6.5S22 12 22 12s-3.5 6.5-10 6.5S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>');
const EYEC=S('<path d="M3 11c2.5 3.5 6 5 9 5s6.5-1.5 9-5M6 14.5 4 17M12 16v3M18 14.5l2 2.5"/>');



let uid=null,perfil={},hide=ls.get("cobros_hide")==="1",sheet=null,foto="",lend=null,busy=false;
const lay=document.createElement("div");document.body.append(lay);
const obs=new MutationObserver(()=>enhance());

function paintEye(){
  const e=R.querySelector(".xeye"),b=R.querySelector("#rs summary b");if(!e||!b)return;
  e.innerHTML=hide?EYEC:EYE;b.textContent=hide?"••••••":(b.dataset.v||b.textContent);
}
function paintTop(){
  const a=R.querySelector('.xtop [data-x="perfil"]'),t=R.querySelector(".xtop b");
  if(a)a.innerHTML=perfil.foto?'<img src="'+esc(perfil.foto)+'" alt="">':USER;
  if(t)t.textContent=perfil.negocio||"Cobros";
}
function ownerView(){
  const h1=R.querySelector("h1"),nb=R.querySelector('[data-act="new"]');
  if(!(h1&&h1.textContent==="Mis préstamos"&&nb)){if(sheet==="notif")sheet=null;return}
  if(R.querySelector(".xtop"))return;
  const rs=R.querySelector("#rs"),sec=rs&&rs.closest("section"),pn=R.querySelector("#pn"),ps=pn&&pn.closest("section"),al=[];
  if(sec&&ps){let e=sec.nextElementSibling;while(e&&e!==ps){al.push(e);e=e.nextElementSibling}}
  const n=R.querySelectorAll(".al").length,bar=h1.parentElement,top=document.createElement("div");
  top.className="xtop";
  top.innerHTML='<button class="xib" data-x="perfil" aria-label="Mi perfil"></button><b></b><button class="xib" data-x="notif" aria-label="Notificaciones'+(n?" ("+n+")":"")+'">'+BELL+(n?'<i class="xdot"></i>':"")+"</button>";
  nb.textContent="＋ Nuevo préstamo";bar.replaceChildren(nb);bar.style.margin="0 0 8px";bar.before(top);paintTop();
  const sm=R.querySelector("#rs summary");
  if(sm){const t=sm.querySelector("b"),e=document.createElement("button");t.dataset.v=t.textContent;e.className="xeye";e.dataset.x="eye";e.setAttribute("aria-label","Mostrar u ocultar el monto");sm.prepend(e);paintEye()}
  const sh=document.createElement("div");sh.className="xsheet";sh.hidden=sheet!=="notif";
  sh.innerHTML='<div class="xbk" data-x="close"></div><div class="xsc"><div class="xhd"><h1>Notificaciones</h1><button class="ghost" data-x="close">Cerrar</button></div><div class="xal"></div></div>';
  const box=sh.querySelector(".xal");
  if(al.length)al.forEach(e=>box.append(e));else box.innerHTML='<p class="sub ok">Hoy no tienes cobros ni atrasos ✔</p>';
  R.append(sh);
}
function clientView(){
  if(!lend||R.querySelector(".xlend"))return;
  const h1=R.querySelector("h1");if(!h1||!(lend.nombre||lend.negocio))return;
  let w=String(lend.wa||"").replace(/\D/g,"");if(w.length===10)w="57"+w;
  const d=document.createElement("div");d.className="note xlend";
  d.innerHTML='<div class="xav">'+(lend.foto?'<img src="'+esc(lend.foto)+'" alt="">':USER)+'</div><div><b>'+esc(lend.nombre||lend.negocio)+"</b>"
   +(lend.nombre&&lend.negocio?"<br><small>"+esc(lend.negocio)+(lend.ciudad?" · "+esc(lend.ciudad):"")+"</small>":"")
   +(lend.pago?"<br><small>Para pagar: "+esc(lend.pago)+"</small>":"")
   +(w?'<br><a class="btn" style="margin-top:6px" target="_blank" rel="noopener" href="https://wa.me/'+w+"?text="+encodeURIComponent("Hola, te escribo por mi préstamo.")+'">Escribir por WhatsApp</a>':"")+"</div>";
  h1.before(d);
}
function enhance(){
  if(busy)return;busy=true;obs.disconnect();
  try{clientView()}catch(x){}
  obs.observe(R,{childList:true});busy=false;
}

const f=(id,l,v,x)=>'<label>'+l+'<input id="'+id+'" '+(x||'type="text"')+' value="'+esc(v||"")+'"></label>';
function openPerfil(){
  foto=perfil.foto||"";
  lay.innerHTML='<div class="xsheet"><div class="xbk" data-x="close"></div><div class="xsc"><div class="xhd"><h1>Mi perfil</h1><button class="ghost" data-x="close">Cerrar</button></div><div class="form"><div id="xp_av" class="xav">'+(foto?'<img src="'+esc(foto)+'" alt="">':USER)+'</div><label>Foto de perfil<input id="xp_f" type="file" accept="image/*"></label>'
   +f("xp_n","Tu nombre",perfil.nombre)+f("xp_neg","Nombre de tu negocio",perfil.negocio)+f("xp_ciu","Ciudad",perfil.ciudad)+f("xp_wa","Tu WhatsApp",perfil.wa,'type="tel" inputmode="tel"')+f("xp_pago","Cómo te pagan (Nequi, Daviplata, cuenta…)",perfil.pago)
   +'<small id="xp_m" class="sub"></small><button data-x="guardar">Guardar perfil</button></div><p class="sub">Tus clientes ven esto en su link.</p><div class="bar"><button class="ghost" data-x="salir">Salir</button></div></div></div>';
}
const closePerfil=()=>{lay.innerHTML=""};
async function avatar(file){
  let bm=null,s,w,h;
  for(const o of [{resizeWidth:600,resizeQuality:"medium"},{}]){try{bm=await createImageBitmap(file,o);break}catch(x){}}
  if(bm){s=bm;w=bm.width;h=bm.height}
  else{s=await new Promise((ok,no)=>{const im=new Image();im.onload=()=>ok(im);im.onerror=no;im.src=URL.createObjectURL(file)});w=s.naturalWidth;h=s.naturalHeight}
  const m=Math.min(w,h),cv=document.createElement("canvas");cv.width=cv.height=256;
  cv.getContext("2d").drawImage(s,(w-m)/2,(h-m)/2,m,m,0,0,256,256);
  return cv.toDataURL("image/jpeg",.75);
}

document.addEventListener("click",async e=>{
  const b=e.target.closest("[data-x]");if(!b)return;const a=b.dataset.x;
  if(a==="eye"){e.preventDefault();hide=!hide;ls.set("cobros_hide",hide?"1":"0");return paintEye()}
  if(a==="notif"){sheet="notif";const s=R.querySelector(".xsheet");if(s)s.hidden=false;return}
  if(a==="perfil")return openPerfil();
  if(a==="close"){sheet=null;const s=R.querySelector(".xsheet");if(s)s.hidden=true;return closePerfil()}
  if(a==="salir"){closePerfil();return signOut(auth)}
  if(a==="guardar"){
    const g=id=>document.getElementById(id).value.trim(),m=document.getElementById("xp_m");
    perfil={nombre:g("xp_n"),negocio:g("xp_neg"),ciudad:g("xp_ciu"),wa:g("xp_wa"),pago:g("xp_pago"),foto};
    ls.set("cobros_perfil_"+uid,JSON.stringify(perfil));paintTop();dispatchEvent(new Event("perfil"));b.disabled=true;m.textContent="Guardando…";
    try{await Promise.race([setDoc(doc(db,"perfiles",uid),perfil),new Promise((_,no)=>setTimeout(()=>no({code:"sin respuesta"}),6000))]);m.textContent="Perfil guardado ✓"}
    catch(x){m.textContent="Se guardó en este celular, pero no se pudo publicar para tus clientes ("+(x.code||"error")+"). Falta actualizar las reglas de Firestore."}
    b.disabled=false;
  }
});
document.addEventListener("change",async e=>{
  if(e.target.id!=="xp_f")return;
  const file=e.target.files[0];e.target.value="";if(!file)return;
  const av=document.getElementById("xp_av"),m=document.getElementById("xp_m");
  try{foto=await avatar(file);av.innerHTML='<img src="'+esc(foto)+'" alt="">'}
  catch(x){m.textContent="No se pudo leer la foto. Elígela desde la galería (formato JPG o PNG)."}
});

onAuthStateChanged(auth,u=>{
  uid=u?u.uid:null;perfil={};
  if(u){
    try{perfil=JSON.parse(ls.get("cobros_perfil_"+u.uid)||"{}")}catch(x){}
    getDoc(doc(db,"perfiles",u.uid)).then(d=>{if(d.exists()){perfil=d.data();ls.set("cobros_perfil_"+u.uid,JSON.stringify(perfil));paintTop();dispatchEvent(new Event("perfil"))}}).catch(()=>{});
  }else closePerfil();
  paintTop();
});
const cid=new URLSearchParams(location.search).get("c");
if(cid)getDoc(doc(db,"prestamos",cid)).then(s=>s.exists()&&s.data().uid?getDoc(doc(db,"perfiles",s.data().uid)):null).then(d=>{if(d&&d.exists()){lend=d.data();enhance()}}).catch(()=>{});
obs.observe(R,{childList:true});enhance();
</script></body></html>
