<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cobro de préstamo</title>
<style>
:root{--bg:#faf8f4;--fg:#1f2a24;--mut:#6b7570;--card:#fff;--bd:#e4e0d6;--ac:#1d7a55;--bad:#b3261e}
@media (prefers-color-scheme:dark){:root{--bg:#15191a;--fg:#e8ece9;--mut:#9aa5a0;--card:#1e2426;--bd:#2d3638;--ac:#4fbf8f;--bad:#ff8a80}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
#root{max-width:560px;margin:0 auto;padding:16px}
h1{margin:0;font-size:24px}h2{font-size:16px;margin:20px 0 8px}
.sub{margin:2px 0 14px;color:var(--mut)}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cards div{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 12px}
.cards span{display:block;font-size:12px;color:var(--mut)}.cards b{font-size:17px}
.cards .big{grid-column:1/-1;border-color:var(--ac)}.cards .big b{font-size:28px;color:var(--ac)}
.note{margin:12px 0;padding:10px 12px;border-radius:12px;background:var(--card);border:1px solid var(--bd)}
.late{color:var(--bad);font-weight:600}.ok{color:var(--ac);font-weight:600}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
button{font:inherit;padding:9px 14px;border-radius:10px;border:0;background:var(--ac);color:#fff;cursor:pointer}
button.ghost{background:transparent;color:var(--fg);border:1px solid var(--bd)}
button.x{padding:2px 8px;background:transparent;color:var(--mut)}
.form{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin:12px 0;display:grid;gap:8px}
label{display:grid;gap:3px;font-size:13px;color:var(--mut)}
input{font:inherit;padding:9px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);color:var(--fg);min-width:0;width:100%}
.err{color:var(--bad);font-size:14px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--bd)}
.row small,.empty{color:var(--mut)}
.item{width:100%;text-align:left;background:var(--card);color:var(--fg);border:1px solid var(--bd);display:flex;justify-content:space-between;margin-bottom:8px}
</style></head>
<body><div id="root"><p class="empty">Cargando…</p></div>
<p class="empty" style="text-align:center;font-size:12px;margin:24px 0">versión 2</p>
<script>
// === CONFIGURACIÓN: pega aquí la URL de tu Apps Script (termina en /exec) ===
const API = "https://script.google.com/macros/s/AKfycbz2gYfC_dS3_sWhFByfDpJDGpWp3r1dx3r0-NUzz78j-wHh1RdCPRlHMAUFsWRSKNe6JA/exec";
// ===========================================================================
const $=document.getElementById("root"),q=new URLSearchParams(location.search);
const M=n=>new Intl.NumberFormat("es-CO",{style:"currency",currency:"COP",maximumFractionDigits:0}).format(n||0);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const F=d=>d?new Date(d+"T00:00").toLocaleDateString("es-CO",{day:"numeric",month:"short",year:"numeric"}):"";
const today=()=>new Date().toISOString().slice(0,10);
let owner=false,PIN="",L={},cur=null,form=null,err="",askDel=false;
try{PIN=localStorage.getItem("pin")||""}catch(e){}
const msg=t=>'<p class="empty">'+t+'</p>';
const get=async p=>(await fetch(API+"?"+p)).json();
const post=async o=>(await fetch(API,{method:"POST",body:JSON.stringify(Object.assign({pin:PIN},o))})).json();
const newId=()=>Array.from(crypto.getRandomValues(new Uint8Array(8)),b=>b.toString(36).padStart(2,"0")).join("").slice(0,12);
function calc(l){
  const p=+l.principal||0,int=p*(+l.rate||0)/100,w=+l.weeks||1,cuota=(p+int)/w;
  const g=l.gastos.reduce((s,x)=>s+x.amt,0),paid=l.pagos.reduce((s,x)=>s+x.amt,0);
  const days=l.start?Math.floor((Date.now()-new Date(l.start+"T00:00"))/864e5):0;
  const el=Math.max(0,Math.min(w,Math.floor(days/7)));
  const late=Math.max(0,el*cuota+g-paid),bal=p+int+g-paid;
  let next=null;if(l.start&&el<w){const d=new Date(l.start+"T00:00");d.setDate(d.getDate()+7*(el+1));next=d.toISOString().slice(0,10)}
  return{int,g,paid,cuota,late,bal,next};
}
const inp=(id,l,t,v,x)=>'<label>'+l+'<input id="'+id+'" type="'+t+'" value="'+esc(v)+'" '+(x||"")+'></label>';
function formHtml(){
  const l=cur.loan;let h='<div class="form">';
  if(form==="setup")h+=inp("f_n","Nombre de la persona","text",l.name)+inp("f_p","Monto prestado (COP)","number",l.principal||"",'inputmode="numeric"')+inp("f_r","Interés total (% sobre lo prestado)","number",l.rate||"","step=\"any\"")+inp("f_w","Número de semanas para pagar","number",l.weeks||"")+inp("f_d","Fecha del préstamo","date",l.start||today());
  if(form==="pago")h+=inp("f_d","Fecha del pago","date",today())+inp("f_a","Monto pagado (COP)","number","",'inputmode="numeric"')+inp("f_t","Nota (opcional)","text","");
  if(form==="gasto")h+=inp("f_d","Fecha","date",today())+inp("f_t","Descripción del gasto","text","")+inp("f_a","Monto (COP)","number","",'inputmode="numeric"');
  if(err)h+='<div class="err">'+esc(err)+"</div>";
  return h+'<div class="bar"><button data-act="save-'+form+'">Guardar</button><button class="ghost" data-act="cancel">Cancelar</button></div></div>';
}
function list(t,arr,k,fn){
  let h="<h2>"+t+"</h2>";if(!arr.length)return h+'<div class="empty">Sin registros</div>';
  arr.forEach((x,i)=>{h+='<div class="row"><div>'+fn(x)+"</div>"+(owner?'<button class="x" data-act="del-'+k+'" data-i="'+i+'">✕</button>':"")+"</div>"});return h;
}
function view(){
  if(owner&&!cur){
    let h="<h1>Mis préstamos</h1><p class=\"sub\">Toca uno para verlo o editarlo.</p>";
    const ids=Object.keys(L);
    if(!ids.length)h+=msg("Aún no tienes préstamos.");
    ids.forEach(id=>{const l=L[id];h+='<button class="item" data-act="open" data-id="'+id+'"><span>'+esc(l.name)+"</span><b>"+M(calc(l).bal)+"</b></button>"});
    return $.innerHTML=h+'<div class="bar"><button data-act="new">+ Nuevo préstamo</button></div>'+(err?'<div class="err">'+esc(err)+"</div>":"");
  }
  const l=cur.loan,c=calc(l);let h="";
  if(owner)h+='<div class="bar"><button class="ghost" data-act="back">← Todos</button></div>';
  h+="<h1>"+esc(l.name||"Nuevo préstamo")+"</h1>";
  if(l.name){
    h+='<p class="sub">Préstamo del '+F(l.start)+"</p>";
    h+='<section class="cards"><div class="big"><span>Saldo pendiente</span><b>'+M(c.bal)+"</b></div><div><span>Prestado</span><b>"+M(l.principal)+"</b></div><div><span>Interés ("+l.rate+"%)</span><b>"+M(c.int)+"</b></div><div><span>Gastos</span><b>"+M(c.g)+"</b></div><div><span>Pagado</span><b>"+M(c.paid)+"</b></div></section>";
    h+='<div class="note">Cuota semanal: <b>'+M(c.cuota)+"</b> × "+l.weeks+" semanas. "+(c.bal<=0?'<span class="ok">Pagado completo ✔</span>':c.late>0?'<span class="late">Atrasado: '+M(c.late)+"</span>":'<span class="ok">Al día</span>')+(c.next&&c.bal>0?" Próximo cobro: "+F(c.next)+".":"")+"</div>";
  }
  if(owner){
    h+=form?formHtml():'<div class="bar"><button data-act="pago">+ Pago</button><button data-act="gasto">+ Gasto</button><button class="ghost" data-act="setup">Editar préstamo</button></div>';
    if(l.name)h+='<label>Link para tu cliente (cópialo y envíalo)<input readonly value="'+location.origin+location.pathname+"?c="+cur.id+'" onclick="this.select()"></label>';
    if(err&&!form)h+='<div class="err">'+esc(err)+"</div>";
  }
  if(l.name){
    h+=list("Pagos",l.pagos,"pago",x=>"<b>"+M(x.amt)+"</b><br><small>"+F(x.d)+(x.n?" · "+esc(x.n):"")+"</small>");
    h+=list("Gastos",l.gastos,"gasto",x=>"<b>"+M(x.amt)+"</b> · "+esc(x.desc)+"<br><small>"+F(x.d)+"</small>");
  }
  if(owner&&l.name)h+='<div class="bar"><button class="ghost" data-act="'+(askDel?"del-loan":"ask-del")+'">'+(askDel?"Toca otra vez para eliminar":"Eliminar préstamo")+"</button></div>";
  $.innerHTML=h;
}
function askPin(m){$.innerHTML='<h1>Entrar</h1><div class="form">'+inp("f_pin","Tu PIN","password","")+(m?'<div class="err">'+m+"</div>":"")+'<button data-act="login">Entrar</button></div>'}
async function load(){
  try{const r=await get("pin="+encodeURIComponent(PIN));
    if(r.error){PIN="";try{localStorage.removeItem("pin")}catch(e){}return askPin("PIN incorrecto")}
    L=r.loans;view();
  }catch(e){$.innerHTML=msg("No se pudo conectar con el servidor.")+"<p class=\"empty\"><small>Detalle técnico: "+esc(e&&e.message)+"</small></p>"}
}
async function save(){
  err="";try{const r=await post({action:"save",id:cur.id,loan:cur.loan});if(r.error)throw 0;L[cur.id]=cur.loan}catch(e){err="No se pudo guardar. Revisa tu conexión e intenta de nuevo."}
  form=null;view();
}
$.addEventListener("click",async e=>{
  const b=e.target.closest("[data-act]");if(!b)return;const a=b.dataset.act,v=id=>document.getElementById(id).value;
  if(a==="login"){PIN=v("f_pin");try{localStorage.setItem("pin",PIN)}catch(x){}return load()}
  if(!owner)return;err="";
  if(a==="open"){cur={id:b.dataset.id,loan:L[b.dataset.id]};form=null;askDel=false;return view()}
  if(a==="back"){cur=null;form=null;return view()}
  if(a==="new"){cur={id:newId(),loan:{name:"",principal:0,rate:0,weeks:0,start:"",pagos:[],gastos:[]}};form="setup";return view()}
  if(a==="cancel"){form=cur.loan.name?null:"setup";if(!cur.loan.name){cur=null;form=null}return view()}
  if(["pago","gasto","setup"].includes(a)){form=a;return view()}
  if(a==="ask-del"){askDel=true;return view()}
  if(a==="del-loan"){try{await post({action:"delete",id:cur.id});delete L[cur.id]}catch(x){}cur=null;askDel=false;return view()}
  const l=cur.loan;
  if(a==="save-setup"){
    const n=v("f_n").trim(),p=+v("f_p"),r=+v("f_r"),w=+v("f_w"),d=v("f_d");
    if(!n||!(p>0)||!(w>0)||!d||r<0){err="Completa nombre, monto, semanas y fecha.";return view()}
    Object.assign(l,{name:n,principal:p,rate:r,weeks:w,start:d});
  }else if(a==="save-pago"||a==="save-gasto"){
    const amt=+v("f_a");if(!(amt>0)){err="Escribe un monto válido.";return view()}
    if(a==="save-pago")l.pagos.push({d:v("f_d"),amt,n:v("f_t").trim()});
    else{if(!v("f_t").trim()){err="Escribe una descripción.";return view()}l.gastos.push({d:v("f_d"),amt,desc:v("f_t").trim()})}
    l.pagos.sort((x,y)=>x.d<y.d?-1:1);l.gastos.sort((x,y)=>x.d<y.d?-1:1);
  }else if(a==="del-pago")l.pagos.splice(+b.dataset.i,1);
  else if(a==="del-gasto")l.gastos.splice(+b.dataset.i,1);
  else return;
  await save();
});
(async()=>{
  if(!API){$.innerHTML=msg("Falta pegar la URL del servidor (API) en index.html.");return}
  const c=q.get("c");
  if(c){try{const r=await get("c="+encodeURIComponent(c));if(r.loan){cur={id:c,loan:r.loan};view()}else $.innerHTML=msg("No encontramos este préstamo. Revisa el enlace.")}catch(e){$.innerHTML=msg("No se pudo cargar. Intenta de nuevo.")+"<p class=\"empty\"><small>Detalle técnico: "+esc(e&&e.message)+"</small></p>"}return}
  owner=true;PIN?load():askPin();
})();
</script></body></html>
